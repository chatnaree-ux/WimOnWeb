<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIM — ระบบบริหารสินค้าคงคลัง</title>
<link rel="icon" href="images/WIMicon.ico" type="image/x-icon">
<script>
  // เช็กก่อนว่ามี Error ส่งกลับมาจากระบบกลางไหม
  const urlParams = new URLSearchParams(window.location.search);
  const error = urlParams.get('error');

  if (!error) {
    window.location.replace('/auth/sso/login');
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#0c1420;
    --navy-900:#111d2e;
    --navy-800:#182a40;
    --steel-700:#25405c;
    --steel-500:#4a6b8a;
    --concrete-200:#e7e4da;
    --concrete-400:#b9b4a5;
    --amber-500:#f2a91c;
    --amber-600:#d8930c;
    --safety-red:#e5533d;
    --ok-green:#3ecf8e;
    --radius:10px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    font-family:'Inter',sans-serif;
    background:
      linear-gradient(180deg, rgba(12,20,32,.94), rgba(12,20,32,.98)),
      repeating-linear-gradient(0deg, transparent 0 39px, rgba(255,255,255,.035) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, rgba(255,255,255,.035) 39px 40px),
      var(--navy-950);
    color:var(--concrete-200);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px clamp(20px,5vw,64px);
    position:relative; z-index:2;
  }

  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:38px; height:38px; border:2px solid var(--amber-500); border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif; font-weight:700; color:var(--amber-500); font-size:15px;
    transform:rotate(-3deg);
  }
  .brand-text{font-family:'Oswald',sans-serif; letter-spacing:.06em; font-size:19px; font-weight:600; color:var(--concrete-200);}
  .brand-text span{color:var(--amber-500);}

  .status-chip{
    display:flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--concrete-400);
    border:1px solid rgba(255,255,255,.12); padding:7px 14px; border-radius:999px;
    background:rgba(255,255,255,.02);
  }
  .status-dot{width:8px; height:8px; border-radius:50%; background:var(--ok-green); box-shadow:0 0 8px var(--ok-green); animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .stage{
    position:relative; z-index:2;
    min-height:calc(100vh - 84px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px 20px 60px;
  }

  .eyebrow{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:clamp(24px,4vw,34px);
    letter-spacing:.03em; color:var(--amber-500); text-transform:uppercase; margin:0 0 26px;
    display:flex; align-items:center; gap:10px; justify-content:center;
  }

  .badge-wrap{position:relative; width:100%; max-width:440px;}

  .login-card{
    background:linear-gradient(180deg, var(--navy-800), var(--navy-900));
    border:1px solid rgba(255,255,255,.08);
    border-radius:var(--radius);
    padding:35px 30px 32px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.6);
    position:relative;
    clip-path:polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%);
    text-align:center;
  }
  .login-card::before{
    content:""; position:absolute; top:0; right:0; width:18px; height:18px;
    background:var(--navy-950); clip-path:polygon(0 0, 100% 0, 100% 100%);
    border-bottom:1px solid rgba(255,255,255,.1); border-left:1px solid rgba(255,255,255,.1);
  }

  .login-head{margin-bottom:28px;}
  .login-head h2{
    font-family:'Oswald',sans-serif; font-size:24px; letter-spacing:.03em; text-transform:uppercase;
    color:#fff; margin:0 0 8px;
  }
  .login-head p{margin:0; font-size:13px; color:var(--concrete-400); line-height:1.5;}

  .btn-primary{
    width:100%; border:0; border-radius:7px; padding:15px 18px; cursor:pointer;
    font-family:'Oswald',sans-serif; font-size:16px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    background:var(--amber-500); color:var(--navy-950);
    display:flex; align-items:center; justify-content:center; gap:10px;
    transition:transform .15s, background .15s, box-shadow .15s;
    box-shadow:0 10px 24px -10px rgba(242,169,28,.55);
    text-decoration:none;
  }
  .btn-primary:hover{background:var(--amber-600); transform:translateY(-1px);}
  .btn-primary:active{transform:translateY(0);}

  .status-msg{
    display:none; margin-top:16px; font-family:'JetBrains Mono',monospace; font-size:12px;
    color:var(--safety-red); border:1px solid rgba(229,83,61,.3); background:rgba(229,83,61,.08);
    padding:10px 12px; border-radius:6px; text-align:center;
  }
  .status-msg.show{display:block;}

  footer{
    position:relative; z-index:2; text-align:center; padding:20px;
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--steel-500);
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">W</div>
    <div class="brand-text">WIM <span>·</span> Warehouse And Inventory Management</div>
  </div>
  <div class="status-chip"><span class="status-dot"></span> กำลังนำทางไปสู่ระบบกลาง...</div>
</div>

<div class="stage">

  <div class="eyebrow">ระบบบริหารสินค้าคงคลัง</div>

  <div class="badge-wrap">
    <div class="login-card">
      <div class="login-head">
        <h2>กำลังเข้าสู่ระบบกลาง</h2>
        <p>ระบบกำลังพาคุณไปยังหน้ายืนยันตัวตน (Central Auth) โปรดรอสักครู่...</p>
      </div>

      <a href="/auth/sso/login" class="btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        คลิกที่นี่หากระบบไม่เปลี่ยนหน้าอัตโนมัติ
      </a>

      <div class="status-msg" id="errorMsg"></div>
    </div>
  </div>

</div>

<footer> ©2026 WIM ⋅ WAREHOUSE AND INVENTORY MANAGEMENT </footer>

<script>
  // แสดงกล่อง Error ถ้าหากมีค่า error ส่งกลับมาทาง URL
  if (error) {
    const errorBox = document.getElementById('errorMsg');
    errorBox.textContent = 'เกิดข้อผิดพลาด: ' + decodeURIComponent(error);
    errorBox.classList.add('show');
  }
</script>

</body>
</html>
