<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIM — ระบบบริหารสินค้าคงคลัง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#0c1420;
    --navy-900:#111d2e;
    --navy-800:#182a40;
    --steel-700:#25405c;
    --steel-500:#4a6b8a;
    --concrete-200:#e7e4da;
    --concrete-400:#b9b4a5;
    --amber-500:#f2a91c;
    --amber-600:#d8930c;
    --safety-red:#e5533d;
    --ok-green:#3ecf8e;
    --radius:10px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    font-family:'Inter',sans-serif;
    background:
      linear-gradient(180deg, rgba(12,20,32,.94), rgba(12,20,32,.98)),
      repeating-linear-gradient(0deg, transparent 0 39px, rgba(255,255,255,.035) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, rgba(255,255,255,.035) 39px 40px),
      var(--navy-950);
    color:var(--concrete-200);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px clamp(20px,5vw,64px);
    position:relative; z-index:2;
  }

  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:38px; height:38px; border:2px solid var(--amber-500); border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif; font-weight:700; color:var(--amber-500); font-size:15px;
    transform:rotate(-3deg);
  }
  .brand-text{font-family:'Oswald',sans-serif; letter-spacing:.06em; font-size:19px; font-weight:600; color:var(--concrete-200);}
  .brand-text span{color:var(--amber-500);}

  .status-chip{
    display:flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--concrete-400);
    border:1px solid rgba(255,255,255,.12); padding:7px 14px; border-radius:999px;
    background:rgba(255,255,255,.02);
  }
  .status-dot{width:8px; height:8px; border-radius:50%; background:var(--ok-green); box-shadow:0 0 8px var(--ok-green); animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .stage{
    position:relative; z-index:2;
    min-height:calc(100vh - 84px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px 20px 60px;
  }

  /* ---------- HERO ---------- */
  .eyebrow{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:clamp(24px,4vw,34px);
    letter-spacing:.03em; color:var(--amber-500); text-transform:uppercase; margin:0 0 26px;
    display:flex; align-items:center; gap:10px; justify-content:center;
  }

  /* ---------- LOGIN CARD (signature element: access-badge terminal) ---------- */
  .badge-wrap{position:relative; width:100%; max-width:440px;}

  .login-card{
    background:linear-gradient(180deg, var(--navy-800), var(--navy-900));
    border:1px solid rgba(255,255,255,.08);
    border-radius:var(--radius);
    padding:30px 30px 26px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.6);
    position:relative;
    clip-path:polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%);
  }
  .login-card::before{
    content:""; position:absolute; top:0; right:0; width:18px; height:18px;
    background:var(--navy-950); clip-path:polygon(0 0, 100% 0, 100% 100%);
    border-bottom:1px solid rgba(255,255,255,.1); border-left:1px solid rgba(255,255,255,.1);
  }

  .login-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px;}
  .login-head h2{
    font-family:'Oswald',sans-serif; font-size:22px; letter-spacing:.03em; text-transform:uppercase;
    color:#fff; margin:0 0 4px;
  }
  .login-head p{margin:0; font-size:12.5px; color:var(--concrete-400); font-family:'JetBrains Mono',monospace;}
  #clock{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--amber-500); text-align:right; white-space:nowrap;}

  .field{margin-bottom:16px;}
  .field label{
    display:block; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.08em;
    color:var(--concrete-400); text-transform:uppercase; margin-bottom:7px;
  }
  .input-shell{
    display:flex; align-items:center; gap:10px;
    background:var(--navy-950); border:1px solid rgba(255,255,255,.1); border-radius:7px;
    padding:0 12px; transition:border-color .18s, box-shadow .18s;
  }
  .input-shell:focus-within{border-color:var(--amber-500); box-shadow:0 0 0 3px rgba(242,169,28,.15);}
  .input-shell svg{flex-shrink:0; opacity:.55;}
  .input-shell input{
    flex:1; background:transparent; border:0; outline:0; color:#fff;
    font-family:'Inter',sans-serif; font-size:14.5px; padding:12px 0;
  }
  .input-shell input::placeholder{color:#5b6b7d;}
  .toggle-pw{
    background:none; border:0; cursor:pointer; color:var(--concrete-400);
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.05em;
    padding:6px 4px;
  }
  .toggle-pw:hover{color:var(--amber-500);}

  .remember-row{
    display:flex; justify-content:space-between; align-items:center;
    margin:6px 0 22px; font-size:12.5px; color:var(--concrete-400);
  }
  .remember-row label{display:flex; align-items:center; gap:7px; cursor:pointer;}
  .remember-row input{accent-color:var(--amber-500);}
  .remember-row a{color:var(--amber-500); text-decoration:none;}
  .remember-row a:hover{text-decoration:underline;}

  .btn-primary{
    width:100%; border:0; border-radius:7px; padding:14px 18px; cursor:pointer;
    font-family:'Oswald',sans-serif; font-size:15px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    background:var(--amber-500); color:var(--navy-950);
    display:flex; align-items:center; justify-content:center; gap:10px;
    transition:transform .15s, background .15s, box-shadow .15s;
    box-shadow:0 10px 24px -10px rgba(242,169,28,.55);
  }
  .btn-primary:hover{background:var(--amber-600); transform:translateY(-1px);}
  .btn-primary:active{transform:translateY(0);}
  .btn-primary:focus-visible{outline:3px solid #fff; outline-offset:2px;}

  .divider{
    display:flex; align-items:center; gap:10px; margin:20px 0 16px;
    color:var(--concrete-400); font-size:11px; font-family:'JetBrains Mono',monospace; text-transform:uppercase;
  }
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:rgba(255,255,255,.1);}

  .helper-links{display:flex; justify-content:center; gap:6px; font-size:12.5px; color:var(--concrete-400);}
  .helper-links a{color:var(--concrete-200); text-decoration:none; font-weight:600;}
  .helper-links a:hover{color:var(--amber-500);}

  .status-msg{
    display:none; margin-top:14px; font-family:'JetBrains Mono',monospace; font-size:12px;
    color:var(--ok-green); border:1px solid rgba(62,207,142,.3); background:rgba(62,207,142,.08);
    padding:9px 12px; border-radius:6px; text-align:center;
  }
  .status-msg.show{display:block;}

  footer{
    position:relative; z-index:2; text-align:center; padding:20px;
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--steel-500);
  }

  @media (prefers-reduced-motion: reduce){
    .status-dot{animation:none;}
    .btn-primary{transition:none;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">W</div>
    <div class="brand-text">WIM <span>·</span> Warehouse And Inventory Management</div>
  </div>
  <div class="status-chip"><span class="status-dot"></span> ระบบพร้อมใช้งาน </div>
</div>

<div class="stage">

  <div class="eyebrow">ระบบบริหารสินค้าคงคลัง</div>

  <!-- LOGIN -->
  <div class="badge-wrap">
    <div class="login-card">
      <div class="login-head">
        <div>
          <h2>เข้าสู่ระบบ</h2>
        </div>
        <div id="clock">--:--:--</div>
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="username">Username</label>
          <div class="input-shell">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="username" placeholder="เช่น warehouse01" autocomplete="username" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-shell">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="toggle-pw" id="togglePw">SHOW</button>
          </div>
        </div>

        <div class="remember-row">
          <label><input type="checkbox"> จดจำฉันไว้</label>
        </div>

        <button type="submit" class="btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          เข้าสู่ระบบ
        </button>

        <div class="status-msg" id="statusMsg">ยืนยันตัวตนสำเร็จ · กำลังนำเข้าสู่เมนูหลัก…</div>
      </form>

    </div>
  </div>

</div>

<footer> ©2026 WIM ⋅ WAREHOUSE AND INVENTORY MANAGEMENT </footer>

<script>
  // นาฬิกาสถานะเทอร์มินัล
  function tick(){
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('th-TH', {hour12:false});
  }
  tick(); setInterval(tick, 1000);

  // toggle show/hide password
  const pwInput = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePw');
  toggleBtn.addEventListener('click', () => {
    const isPw = pwInput.type === 'password';
    pwInput.type = isPw ? 'text' : 'password';
    toggleBtn.textContent = isPw ? 'HIDE' : 'SHOW';
  });

  // เชื่อมต่อ backend จริง: POST ไปที่ /api/login
  const form = document.getElementById('loginForm');
  const statusMsg = document.getElementById('statusMsg');
  const submitBtn = form.querySelector('.btn-primary');

  function showStatus(message, isError){
    statusMsg.textContent = message;
    statusMsg.style.color = isError ? '#ff8a75' : '';
    statusMsg.style.borderColor = isError ? 'rgba(229,83,61,.4)' : '';
    statusMsg.style.background = isError ? 'rgba(229,83,61,.08)' : '';
    statusMsg.classList.add('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    submitBtn.disabled = true;
    submitBtn.style.opacity = '.7';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        showStatus('ยืนยันตัวตนสำเร็จ · กำลังนำเข้าสู่เมนูหลัก…', false);
        // เก็บข้อมูลผู้ใช้ไว้ใช้แสดงผลในหน้า main menu (ยังไม่ใช่ session ฝั่ง server จริง)
        sessionStorage.setItem('wim_user', JSON.stringify(data.user || { Username: username }));
        setTimeout(() => {
          window.location.href = '/main-menu.html';
        }, 700);
      } else {
        showStatus(data.message || 'เข้าสู่ระบบไม่สำเร็จ', true);
      }
    } catch (err) {
      showStatus('เชื่อมต่อ server ไม่ได้ กรุณาลองใหม่', true);
    } finally {
      submitBtn.disabled = false;
      submitBtn.style.opacity = '';
      setTimeout(() => statusMsg.classList.remove('show'), 4000);
    }
  });
</script>

</body>
</html>
