  // ---------- ส่งต่อใบขอปรับยอดสต๊อก (ชุดเดียวกัน 2 หน้า: ตรวจนับ / อนุมัติปรับยอด) ----------
  // ส่งรวม (กลุ่ม LINE) = ข้อความเดียว: ลิงก์ของทุกขั้นที่ยังค้าง / ขั้นที่กดแล้วแสดงชื่อ + วันที่แทน
  // แยกตามขั้น (ส่งส่วนตัว) = ข้อความ + ลิงก์ของขั้นที่เลือก หรือคัดลอกเฉพาะลิงก์
  // ยังไม่บังคับว่าแต่ละขั้นต้องเป็นคนละคน (คนที่มีสิทธิ์หลายขั้นเปิดลิงก์ไหนก็กดได้ทุกขั้นของตัวเอง)
  const SHARE_STEPS = STEPS;
  const SHARE_ROLE = { ack: 'ผู้รับทราบ', check: 'ผู้ตรวจสอบ', approve: 'ผู้อนุมัติ' };
  let shareQ = null, shareMode = 'all';
  const rqLink = (id, k) => `${location.origin}/stock-adjust-approve?id=${id}&step=${k}`;
  function rqMsg(q, k){
    const info = [`บริษัท: ${q.compName}`,
      q.scCode ? `จากการตรวจนับ: ${q.scCode}${q.scType ? ` (${q.scType})` : ''}` : (q.note ? `เหตุผล: ${q.note}` : ''),
      `จำนวน: ${q.nLine} รายการ (ปรับเพิ่ม ${q.nPlus} / ปรับลด ${q.nMinus})`].filter(Boolean);
    if(k === 'all'){
      const st = (s) => q.steps && q.steps[s];
      return [`รบกวนดำเนินการใบขอปรับยอดสต๊อก ${q.docCode}`, ...info, '',
        ...SHARE_STEPS.map(([s, n]) => st(s) ? `✓ ${n}แล้ว: ${st(s).by ? shortName(st(s).by) + ' ' : ''}${st(s).at ? thDate(st(s).at) : ''}`.trim()
          : `ลิงก์สำหรับ${SHARE_ROLE[s]}: ${rqLink(q.id, s)}`)].join('\n');
    }
    const n = { ack: 'รับทราบ', check: 'ตรวจสอบ', approve: 'อนุมัติ' }[k];
    return [`รบกวน${n}ใบขอปรับยอดสต๊อก ${q.docCode}`, ...info, `กด${n}ได้ที่: ${rqLink(q.id, k)}`].join('\n');
  }
  function shareHtml(q, sel){
    const pend = SHARE_STEPS.filter(([k]) => !(q.steps && q.steps[k]));
    if(!pend.length) return '';
    const all = shareMode === 'all';
    const k = pend.some(s => s[0] === sel) ? sel : pend[0][0];
    return `<div class="share" data-sel="${k}">
      <div class="seg" style="margin-bottom:8px">
        <button type="button" class="${all ? 'on' : ''}" data-sharemode="all">ส่งรวม</button>
        <button type="button" class="${all ? '' : 'on'}" data-sharemode="one">แยกตามขั้น</button></div>
      ${all ? '' : `<div class="sh-seg seg">${SHARE_STEPS.map(([s, n]) => (q.steps && q.steps[s]) ? `<button type="button" disabled>${n} ✓</button>`
        : `<button type="button" class="${s === k ? 'on' : ''}" data-sharestep="${s}">${n}</button>`).join('')}</div>`}
      <textarea class="msg-box ${all ? 'all' : ''}" aria-label="ข้อความส่งลิงก์ตามอนุมัติ">${esc(rqMsg(q, all ? 'all' : k))}</textarea>
      <div class="send-actions">
        ${all ? '' : `<button type="button" class="btn btn-secondary" data-copy="${esc(rqLink(q.id, k))}" data-copied="คัดลอกลิงก์${esc(SHARE_STEPS.find(s => s[0] === k)[1])}แล้ว">${IC.link} คัดลอกลิงก์</button>`}
        <button type="button" class="btn btn-line" data-copymsg="1">${IC.copy} คัดลอกข้อความ</button>
      </div></div>`;
  }
  // r = แถวในรายการ (ไม่ต้องโหลดใบเต็ม) / ไม่ส่ง = ใบที่เปิดอยู่ใน popup
  function shareDlg(r){
    const d = doc;
    shareQ = r ? { id: r.id, docCode: r.docCode, compName: r.compName, scCode: r.scCode, scType: null, note: r.note, nLine: r.nLine, nPlus: r.nPlus, nMinus: r.nMinus, steps: r.steps }
      : { id: d.id, docCode: d.docCode, compName: d.compName, scCode: d.sc ? d.sc.docCode : null, scType: d.sc ? d.sc.typeName : null, note: d.note,
      nLine: d.lines.length, nPlus: d.lines.filter(l => l.op === '+').length, nMinus: d.lines.filter(l => l.op === '-').length, steps: d.steps };
    dlg('ส่งลิงก์ตามอนุมัติ ' + shareQ.docCode, `${shareHtml(shareQ, actStep())}
      <div class="action-bar" style="margin-top:12px"><button type="button" class="btn btn-secondary" data-close="dlgModal">ปิด</button></div>`);
  }

  // ---------- พิมพ์ใบขอปรับยอดสต๊อก (A4 แนวตั้ง, Chromium) — จำนวนอย่างเดียว ยังไม่แสดงมูลค่า ----------
  /* ---------- พิมพ์เอกสาร: แบ่งหน้าเอง (วัดความสูงจริง) ----------
     ไม่ปล่อยให้ Chrome ตัดตารางข้ามหน้าเอง (เส้นหลุด / เส้นคอลัมน์ยื่นลงที่ว่าง / แถวท้ายหน้าไม่มีเส้นปิด)
     ทุกหน้า = หัวเอกสาร + ตาราง (หัวตารางซ้ำ ปิดเส้นล่างครบ) + ลงนาม / ท้ายกระดาษ ชิดล่าง
     parts: [{ html }] = บล็อกไม่ตัดข้ามหน้า / [{ cols:[%], thead, cls, rows:[{ html, keep }] }] = ตาราง (keep = ติดกับแถวถัดไป เช่น แถวตำแหน่ง) */
  const PAGE_MM = { P: [194, 279], L: [281, 192] };   // A4 − ขอบ 8 มม. (เผื่อปัดเศษไม่ให้ล้นเป็นหน้าว่าง)
  const MMPX = 96 / 25.4;
  const IOS_PRINT = IS_IOS || new URLSearchParams(location.search).get('autoprint') === '1';   // iPhone / iPad พิมพ์จากหน้านี้เองก็ใช้แผ่นเตี้ยลง (ขอบ iOS กินที่)
  const tableHtml = (p, rows) => `<div class="ps-part"><table class="${p.cls || ''}"><colgroup>${p.cols.map(w => `<col style="width:${w}%">`).join('')}</colgroup>
      <thead>${p.thead}</thead><tbody>${rows.map(x => x.html).join('')}</tbody></table></div>`;
  async function pagedHtml({ landscape, head, parts, foot, maxPages }){
    printSeq++;   // เริ่มเตรียมเอกสารใหม่ = ยกเลิกคำสั่งพิมพ์ที่ยังรอรูปอยู่ (#printArea ถูกใช้วัดความสูงหน้า)
    const [w, h0] = PAGE_MM[landscape ? 'L' : 'P'], h = IOS_PRINT ? h0 - 54 : h0;   // iPhone: ขอบ + หัวท้ายกระดาษของ iOS กินที่ → แผ่นเตี้ยลงไม่ให้ล้นหน้า
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const pa = $('printArea'), keep = pa.getAttribute('style');
    pa.style.cssText = `display:block; position:absolute; left:-10000px; top:0; width:${w}mm; visibility:hidden;`;
    pa.innerHTML = `<div class="m-head ps-part">${head}</div><div class="m-foot ps-pfoot ps-part">${foot(1, 1)}</div><div class="m-cont ps-cont">มีต่อหน้าถัดไป</div>`
      + parts.map((p, i) => `<div class="m-part" data-i="${i}">${p.rows ? tableHtml(p, p.rows) : `<div class="ps-part">${p.html}</div>`}</div>`).join('');
    const H = (el) => el.getBoundingClientRect().height;
    const contEl = pa.querySelector('.m-cont'), headH = H(pa.querySelector('.m-head')), footH = H(pa.querySelector('.m-foot'))
      + H(contEl) + parseFloat(getComputedStyle(contEl).marginTop);   // เผื่อบรรทัด "มีต่อหน้าถัดไป" ทุกหน้า
    const meas = parts.map((p, i) => {
      const el = pa.querySelector(`.m-part[data-i="${i}"]`);
      if(!p.rows) return { h: H(el) };
      const rowsH = [...el.querySelectorAll('tbody > tr')].map(H);
      return { base: H(el) - rowsH.reduce((a, b) => a + b, 0), rowsH };   // base = หัวตาราง + ระยะขอบ
    });
    pa.innerHTML = '';
    if(keep == null) pa.removeAttribute('style'); else pa.setAttribute('style', keep);
    const avail = h * MMPX - headH - footH - 4;
    const pages = [];
    let cur = [], used = 0;
    const newPage = () => { pages.push(cur); cur = []; used = 0; };
    parts.forEach((p, i) => {
      const m = meas[i];
      if(!p.rows){
        // keepNext (หัวข้อ): ต้องมีที่พอสำหรับส่วนถัดไปอย่างน้อย 1 แถว ไม่งั้นย้ายไปหน้าใหม่พร้อมกัน
        const nx = p.keepNext && meas[i + 1], nxH = !nx ? 0 : nx.rowsH ? nx.base + (nx.rowsH[0] || 0) + (parts[i + 1].rows[0] && parts[i + 1].rows[0].keep ? nx.rowsH[1] || 0 : 0) : nx.h;
        if(used && used + m.h + nxH > avail) newPage();
        cur.push(`<div class="ps-part">${p.html}</div>`); used += m.h; return;
      }
      // กลุ่มแถว: แถวที่ keep ติดไปกับแถวถัดไป (หัวตำแหน่งไม่ค้างท้ายหน้า)
      const groups = [];
      for(let k = 0; k < p.rows.length; k++){ const g = [k]; while(p.rows[g[g.length - 1]].keep && g[g.length - 1] + 1 < p.rows.length) g.push(g[g.length - 1] + 1); groups.push(g); k = g[g.length - 1]; }
      let chunk = [];
      const flush = () => { if(chunk.length){ cur.push(tableHtml(p, chunk.map(k => p.rows[k]))); chunk = []; } };
      groups.forEach(g => {
        const gh = g.reduce((a, k) => a + m.rowsH[k], 0);
        const need = gh + (chunk.length ? 0 : m.base);
        if(used && used + need > avail){ flush(); newPage(); }
        if(!chunk.length) used += m.base;
        chunk.push(...g); used += gh;
      });
      flush();
    });
    pages.push(cur);
    if(maxPages) pages.length = Math.min(pages.length, maxPages);   // ใบนับเปล่า: ตัดตามจำนวนหน้าที่ขอ
    const n = pages.length;
    return pages.map((body, k) => `<div class="ps-pg" style="height:${h}mm"><div class="ps-part">${head}</div><div class="ps-body">${body.join('')}${k < n - 1 ? '<div class="ps-cont">มีต่อหน้าถัดไป</div>' : ''}</div><div class="ps-pfoot ps-part">${foot(k + 1, n)}</div></div>`).join('');
  }

  /* ---------- โหมดฝัง (?id=&embed=1): ใบขอปรับยอดสต๊อกเป็นแผ่น A4 อย่างเดียว ไม่มีเมนู / รายการ
     หน้าเอกสารตรวจนับเปิดใน iframe แล้วสั่งพิมพ์เอง / &autoprint=1 = แท็บใหม่ที่พิมพ์ทันที (iPhone / iPad) ---------- */
  const EMBED = params().get('embed') === '1';
  const embedPost = (msg) => { try{ if(window.parent !== window) window.parent.postMessage(Object.assign({ type: 'rq-doc' }, msg), location.origin); } catch(err){} };
  function embedMsg(text){ $('printArea').innerHTML = `<div class="pv-msg">${esc(text)}</div>`; document.body.classList.add('pv'); embedPost({ ok: false, message: text }); }
  async function embedRq(){
    try{ const r = await api('/api/stock-adjust/doc/' + parseInt(params().get('id'), 10)); await printRq(r.data); }
    catch(err){ embedMsg(err.message); }
  }
  function embedShow(html){
    const pa = $('printArea');
    pa.innerHTML = html;
    pa.querySelectorAll('.ps-pg').forEach(p => { p.style.minHeight = IOS_PRINT ? `calc(${p.style.height} - 14mm)` : p.style.height; if(IOS_PRINT) p.style.height = 'auto'; });   // ย่อบนจอเล็กตัดบรรทัดต่างได้ → แผ่นยืดได้ ไม่ตัดท้าย
    pa.style.width = (194 + 16 + 0.8) + 'mm';   // แผ่น A4 แนวตั้ง = พื้นที่พิมพ์ + ขอบ 8 มม. 2 ข้าง
    document.body.classList.add('printing', 'pv');
    const fit = () => { pa.style.setProperty('--pvz', 1); const w = pa.getBoundingClientRect().width; pa.style.setProperty('--pvz', Math.min(1, (window.innerWidth - 16) / w).toFixed(3)); };
    fit(); window.addEventListener('resize', fit);
    embedPost({ ok: true });
    if(params().get('autoprint') === '1'){
      const imgs = [...pa.querySelectorAll('img')].filter(i => !i.complete);
      Promise.race([Promise.all(imgs.map(i => new Promise(ok => { i.addEventListener('load', ok); i.addEventListener('error', ok); }))), new Promise(ok => setTimeout(ok, 3000))])
        .then(() => setTimeout(() => window.print(), 200));
    }
  }
  /* สั่งพิมพ์ (Chromium): ใส่เอกสารใน #printArea → รอโลโก้ / รูปลายเซ็นโหลด (ไม่เกิน 3 วินาที) → window.print()
     ทีละคำสั่ง: กดพิมพ์ซ้ำ / กดใบอื่นระหว่างรอรูป = ใช้คำสั่งล่าสุด ยกเลิกคำสั่งเก่า
     (เดิม 2 คำสั่งซ้อนกัน: ปิดหน้าพิมพ์ใบแรกแล้วล้างโหมดพิมพ์ของใบที่สองไปด้วย → ใบที่สองพิมพ์ทั้งหน้าจอแทนเอกสาร)
     คืน Promise ที่จบเมื่อปิดหน้าพิมพ์ (true) / ถูกคำสั่งใหม่แทน (false) */
  let printSeq = 0;
  function doPrint(html, landscape){
    if(EMBED){ embedShow(html); return Promise.resolve(true); }
    const my = ++printSeq;
    $('printArea').innerHTML = html;
    if(IOS_PRINT) $('printArea').querySelectorAll('.ps-pg').forEach(p => { p.style.minHeight = `calc(${p.style.height} - 14mm)`; p.style.height = 'auto'; });
    const imgs = [...$('printArea').querySelectorAll('img')].filter(i => !i.complete);
    if(imgs.length) showToast('กำลังเตรียมเอกสารสำหรับพิมพ์…');
    const ready = Promise.race([Promise.all(imgs.map(i => new Promise(ok => { i.addEventListener('load', ok); i.addEventListener('error', ok); }))), new Promise(ok => setTimeout(ok, 3000))]);
    return ready.then(() => new Promise(res => setTimeout(() => {
      if(my !== printSeq) return res(false);
      let pageStyle = null, t = null;
      if(landscape){ pageStyle = document.createElement('style'); pageStyle.textContent = '@page{size:A4 landscape; margin:8mm;}'; document.head.appendChild(pageStyle); }
      const done = () => { window.removeEventListener('afterprint', done); clearTimeout(t); if(my === printSeq) document.body.classList.remove('printing'); if(pageStyle) pageStyle.remove(); res(true); };
      document.body.classList.add('printing');
      window.addEventListener('afterprint', done);
      window.print();
      t = setTimeout(done, 1500);
    }, 60)));
  }
  const psFull = (p) => p ? (p.full || shortName(p.name)) : '';
  const printStamp = () => thStamp(new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString());
  // ช่องลงนาม: ขั้นที่กดในระบบแล้ว = พิมพ์ชื่อ-นามสกุล / ตำแหน่ง / วันที่ ให้ (เซ็นจริงบนเส้น) / ยังไม่กด = เว้นว่างให้เขียน
  // ขั้นที่กดในระบบแล้ว = รูปลายเซ็นของคนกด (ถ้ามีรูป) เหนือเส้น เหมือนใบส่งคืนสินค้า
  const ESIGN_URL = (idPs) => `https://seedsgroup.dyndns.org/spm/images/eSign/${encodeURIComponent(idPs)}.png`;
  function signBox(role, s){
    return `<div><div class="sg">${s && s.id ? `<img src="${ESIGN_URL(s.id)}" alt="" onerror="this.remove()">` : ''}</div><div class="l"></div>
      <div class="nm">(${s && psFull(s) ? esc(psFull(s)) : '<span class="bl"></span>'})</div>
      <div class="pos">${s && s.position ? esc(s.position) : '<span class="bl"></span>'}</div>
      <b class="rl">${role}</b>
      <div class="dt">วันที่ ${s && s.at ? `<b>${thDate(s.at)}</b>` : '........./........./.........'}</div></div>`;
  }
  async function printRq(d = doc){
    const plus = d.lines.filter(l => l.op === '+').length, minus = d.lines.length - plus;
    const refRaw = d.sc ? `ตรวจนับสต๊อก ${d.sc.docCode}${d.sc.typeName ? ` (${d.sc.typeName})` : ''}`
      : d.revOf ? `กลับรายการปรับยอดสต๊อก ${d.revOf.docCode}${d.revOf.rqCode ? ` (${d.revOf.rqCode})` : ''}` : '';
    const ref = esc(refRaw);
    // ใบจากการตรวจนับ: เหตุผลขึ้นต้นด้วยข้อความเดียวกับอ้างอิง → ตัดส่วนที่ซ้ำ เหลือเฉพาะที่ผู้ตรวจสอบเขียนเพิ่ม (ไม่มี = ไม่แสดงบรรทัดเหตุผล)
    let reason = String(d.note || '').trim();
    if(refRaw && reason.startsWith(refRaw)) reason = reason.slice(refRaw.length).replace(/^[\s\/·:\-]+/, '').trim();
    // ผู้ออกคำสั่ง / ผู้ปฏิบัติงาน: ชื่ออย่างเดียว (ตำแหน่งยาว ๆ ล้นช่อง)
    const who = (p) => p ? esc(psFull(p)) : '-';
    const ci = d.compInfo || {};
    const withPost = (a, p) => !p || a.includes(p) ? a : `${a} ${p}`;
    const withProv = (a, p) => !p || a.includes(p) ? a : `${a} ${/กรุงเทพ/.test(p) ? '' : 'จ.'}${p}`;
    const coAddr = ci.address ? withPost(withProv(ci.address.trim(), ci.province), ci.postCode) : '';
    const coAddrEn = ci.addressEn ? withPost(ci.addressEn.trim(), ci.postCode) : '';
    const coContact = [ci.tel ? `โทร ${esc(ci.tel)}` : '', ci.fax ? `แฟกซ์ ${esc(ci.fax)}` : '', ci.taxId ? `เลขประจำตัวผู้เสียภาษี ${esc(ci.taxId)}` : ''].filter(Boolean).join(' · ');
    const head = `<div class="ps-co">
        <img src="${LOGO_BASE_URL + encodeURIComponent(d.idComp)}.jpg" alt="" onerror="this.remove()">
        <div class="ps-cbody"><div class="ps-comp">${esc(d.compName)}</div>${ci.nameEn ? `<div class="ps-en2">${esc(ci.nameEn)}</div>` : ''}
          ${coAddr ? `<div class="ps-l">${esc(coAddr)}</div>` : ''}${coAddrEn ? `<div class="ps-l">${esc(coAddrEn)}</div>` : ''}${coContact ? `<div class="ps-l">${coContact}</div>` : ''}</div>
        <div class="ps-top"><h2>ใบขอปรับยอดสต๊อก</h2><div class="ps-en">STOCK ADJUSTMENT REQUEST</div>
        <table class="ps-box"><tbody><tr><th>เลขที่</th><td>${esc(d.docCode)}</td></tr><tr><th>วันที่ขอปรับ</th><td>${thStamp(d.dateTs)}</td></tr>${d.cancel ? '<tr><th>สถานะ</th><td>ยกเลิก</td></tr>' : ''}</tbody></table></div>
      </div>
      <div class="ps-head cols2">
        <div><b>ผู้ออกคำสั่ง:</b> ${who(d.commandPs)}</div><div>${ref ? `<b>อ้างอิง:</b> ${ref}` : ""}</div>
        <div><b>ผู้ปฏิบัติงาน:</b> ${who(d.actionPs)}</div>
        <div>${d.sc ? `<b>คลัง/พื้นที่:</b> ${esc(d.sc.scope || '-')} · <b>ตรวจนับ</b> ${thDate(d.sc.dateCount)}` : ''}</div>
        ${reason || !refRaw ? `<div style="grid-column:1/-1"><b>เหตุผลการขอปรับยอดสต๊อก:</b> ${esc(reason || '-')}</div>` : ''}
      </div>`;
    const rows = d.lines.map((l, i) => ({ html: `<tr><td class="c">${i + 1}</td><td>${esc(l.invName)}</td><td class="lot">${esc(l.lotNo)}</td><td class="loc">${esc(l.loc || '-')}</td><td class="c">${esc(l.unit)}</td>
      <td class="n">${fmtQty(l.before)}</td><td class="n">${l.op === '+' ? fmtQty(l.amount) : ''}</td><td class="n">${l.op === '-' ? fmtQty(l.amount) : ''}</td><td class="n">${fmtQty(l.after)}</td><td>${esc(l.note || '')}</td></tr>` }));
    rows.push({ html: `<tr class="ps-tot"><td colspan="6" style="text-align:right">รวม ${d.lines.length} รายการ (จำนวนรายการ ปรับเพิ่ม / ปรับลด)</td><td class="c">${plus}</td><td class="c">${minus}</td><td colspan="2"></td></tr>` });
    const part = { cls: 'ps-rq', cols: [5.2, 18.3, 13.5, 10, 8, 8.5, 7.5, 7.5, 8.5, 13],
      thead: '<tr><th>ลำดับ</th><th>ชื่อสินค้า</th><th>Lot No.</th><th>คลัง</th><th>หน่วย</th><th>คงเหลือ<br>ก่อนปรับ</th><th>ปรับ<br>เพิ่ม</th><th>ปรับ<br>ลด</th><th>คงเหลือ<br>หลังปรับ</th><th>สาเหตุ /<br>หมายเหตุ</th></tr>', rows };
    const foot = (p, n) => `<div class="ps-sign s3">${STEPS.map(([k]) => signBox(SIGN_ROLE[k], d.steps[k])).join('')}</div>
      <div class="ps-foot"><span>${esc(d.docCode)} · ใบขอปรับยอดสต๊อก · ${d.lines.length} รายการ</span><span>หน้า ${p}/${n}</span><span>พิมพ์ ${printStamp()}</span></div>`;
    return doPrint(await pagedHtml({ head, parts: [part], foot }));
  }

  // พิมพ์จากรายการ: โหลดใบเต็ม (รายการ + ข้อมูลบริษัท) แล้วพิมพ์ ไม่ต้องเปิด popup
  async function printFromList(btn, id){
    if(btn.disabled) return; const h = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'กำลังเตรียม…';
    try{ const r = await api('/api/stock-adjust/doc/' + id); await printRq(r.data); } catch(err){ alert(err.message); } finally{ btn.disabled = false; btn.innerHTML = h; }
  }
  async function run(btn, fn){
    if(btn.disabled) return; const h = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'กำลังบันทึก…';
    try{ await fn(); } catch(err){ alert(err.message); } finally{ if(document.body.contains(btn)){ btn.disabled = false; btn.innerHTML = h; } }
  }

  document.addEventListener('click', async (e) => {
    const t = e.target;
    if(t.closest('[data-closesum]') || t.id === 'sumModal'){ closeSum(); return; }
    const ss = t.closest('[data-scsum]'); if(ss){ openSum(ss.dataset.scsum, ss.dataset.sccode); return; }
    if(t.closest('[data-sumprint]')){ printSum(); return; }
    const c = t.closest('[data-close]'); if(c){ closeDlg(); return; }
    if(t.id === 'dlgModal'){ closeDlg(); return; }
    if(t.closest('[data-closedoc]') || t.id === 'docModal'){ closeDoc(); return; }
    if(t.closest('.pick') || t.closest('[data-pickall]') || t.closest('.bulk label')) return;   // ช่องเลือก: จัดการใน change
    const o = t.closest('[data-open]');
    if(o){ backUrl = location.pathname + location.search; if(TRACK){ go(`${BASE}?id=${o.dataset.open}`); return; } const st = o.dataset.openstep || curStep(); go(`/stock-adjust-approve?id=${o.dataset.open}${st ? '&step=' + st : ''}${o.dataset.openstep ? '' : '&view=1'}`); return; }
    const tt = t.closest('[data-ttab]'); if(tt){ if(trk.tab !== tt.dataset.ttab){ trk.tab = tt.dataset.ttab; loadList(); } return; }
    if(t.closest('[data-tmore]')){ trk.show += TRK_PAGE; renderList(); return; }
    const rs = t.closest('[data-rshare]'); if(rs){ const r = rows.find(x => x.id === Number(rs.dataset.rshare)); if(r) shareDlg(r); return; }
    const rp = t.closest('[data-rprint]'); if(rp){ printFromList(rp, Number(rp.dataset.rprint)); return; }
    const sm = t.closest('[data-sharemode]'); if(sm){ shareMode = sm.dataset.sharemode; const box = sm.closest('.share'); if(box && shareQ) box.outerHTML = shareHtml(shareQ, box.dataset.sel); return; }
    const bk = t.closest('[data-bulk]'); if(bk){ bulkDlg(bk.dataset.bulk); return; }
    const bg = t.closest('[data-bulkgo]'); if(bg){ bulkGo(bg, bg.dataset.bulkgo); return; }
    const shs = t.closest('[data-sharestep]'); if(shs){ const box = shs.closest('.share'); if(box && shareQ) box.outerHTML = shareHtml(shareQ, shs.dataset.sharestep); return; }
    const cm = t.closest('[data-copymsg]'); if(cm){ const v = cm.closest('.share').querySelector('.msg-box').value; try{ await navigator.clipboard.writeText(v); showToast('คัดลอกข้อความแล้ว — วางใน LINE / e-mail ได้เลย'); } catch(err){ prompt('คัดลอกข้อความนี้', v); } return; }
    const cp = t.closest('[data-copy]'); if(cp){ try{ await navigator.clipboard.writeText(cp.dataset.copy); showToast(cp.dataset.copied || 'คัดลอกลิงก์แล้ว'); } catch(err){ prompt('คัดลอกลิงก์นี้', cp.dataset.copy); } return; }
    const st = t.closest('[data-step]'); if(st){ stepDlg(st.dataset.step); return; }
    const cf = t.closest('[data-confirm]');
    if(cf){ const k = cf.dataset.confirm; run(cf, async () => { const x = await api(`/api/stock-adjust/doc/${doc.id}/step`, { body: { step: k, note: $('stepNote').value } }); closeDlg(); showToast(x.postCode ? `บันทึก${STEP_NAME[k]}แล้ว · ปรับสต๊อกแล้ว เลขที่ ${x.postCode}` : `บันทึก${STEP_NAME[k]}แล้ว`); await openDoc(doc.id); loadList(); }); return; }
    const a = t.closest('[data-act]'); if(!a) return;
    if(a.dataset.act === 'print') printRq();
    else if(a.dataset.act === 'share') shareDlg();
    else if(a.dataset.act === 'sendback') sendBackDlg();
    else if(a.dataset.act === 'sendback-confirm') run(a, async () => { await api(`/api/stock-adjust/doc/${doc.id}/send-back`, { body: { note: $('sbNote').value } }); closeDlg(); showToast(doc.src === 'REV' ? 'ไม่อนุมัติกลับรายการแล้ว' : 'ส่งกลับแก้ไขแล้ว'); await openDoc(doc.id); loadList(); });
    else if(a.dataset.act === 'reverse') AdjReverse.open(doc.posted.id, { onDone: () => openDoc(doc.id) });
  });
  // ช่องเลือก: ทีละใบ / ทั้งหมด (เฉพาะแท็บรอฉันดำเนินการ)
  document.addEventListener('change', (e) => {
    const t = e.target;
    if(t.dataset && t.dataset.pick){ const id = Number(t.dataset.pick); if(t.checked) picked.add(id); else picked.delete(id); renderList(); return; }
    if(t.dataset && t.dataset.pickall){ const mine = rows.filter(r => canDo(r, listStep())); if(t.checked) mine.forEach(r => picked.add(r.id)); else picked.clear(); renderList(); return; }
    if(t.id === 'fComp'){ try{ localStorage.setItem('adj_comp', t.value); } catch(err){} picked.clear(); loadList(); }
    if(t.id === 'tFrom' || t.id === 'tTo'){ const x = $(t.id + 'Text'); x.textContent = t.value ? thDate(t.value) : 'วว/ดด/ปปปป'; x.classList.toggle('empty', !t.value); }
    if(t.id === 'tSrc' || t.id === 'tFrom' || t.id === 'tTo'){ trk.src = $('tSrc').value; trk.from = $('tFrom').value; trk.to = $('tTo').value; loadList(); }
  });
  // Refresh: โหลดรายการใหม่ (แท็บอนุมัติครบแล้วโหลดใหม่ด้วย)
  document.addEventListener('click', (e) => { if(e.target.closest('#btnRefresh')) loadList(); });
  document.addEventListener('keydown', (e) => { if(e.key !== 'Escape') return; if($('sumModal').classList.contains('show')) closeSum(); else if($('dlgModal').classList.contains('show')) closeDlg(); else if($('docModal').classList.contains('show')) closeDoc(); });
  let qTimer = null;
  document.addEventListener('input', (e) => { if(e.target.id !== 'tQ') return; clearTimeout(qTimer); qTimer = setTimeout(() => { const v = e.target.value.trim(); if(v !== trk.q){ trk.q = v; loadList(); } }, 400); });
  window.addEventListener('popstate', route);
  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
