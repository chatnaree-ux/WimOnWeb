<script>
(function(){
  'use strict';
  /* ==================================================================
     งานรออนุมัติ (/approvals) — ทุกเรื่องที่รอผู้ใช้คนนี้ในที่เดียว (GET /api/approval-inbox)
       ใบขอปรับยอดสต๊อก / ส่งคืนสินค้า Supplier = ตามสิทธิ์ขั้น · Over PO = ผู้อนุมัติที่ถูกระบุตัว
       กดรายการ = เปิดหน้าเอกสารเดิมของเรื่องนั้น (&from=inbox → ปิด / กลับ = มาที่นี่)
       ใบขอปรับยอดสต๊อก: ติ๊กหลายใบแล้วกดขั้นตอนเดียวกันพร้อมกันได้ (POST /api/stock-adjust/bulk-step)
  ================================================================== */
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s == null ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtInt = (n) => Number(n || 0).toLocaleString('en-US');
  const fmtMoney = (n) => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const thDate = (iso) => { if(!iso) return '-'; const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number); return `${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${y + 543}`; };
  const thStamp = (s) => s ? `${thDate(s)} ${String(s).slice(11, 16)}` : '-';
  const shortName = (n) => String(n || '').replace(/\s*\([^)]*\)\s*$/, '');
  const daysSince = (iso) => iso ? Math.max(0, Math.floor((Date.now() - new Date(String(iso).slice(0, 10) + 'T00:00:00')) / 864e5)) : 0;
  const store = { get(k){ try{ return localStorage.getItem('apv_' + k); } catch(e){ return null; } }, set(k, v){ try{ localStorage.setItem('apv_' + k, v); } catch(e){} } };
  function showToast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(showToast._t); showToast._t = setTimeout(() => t.classList.remove('show'), 3500); }
  async function api(url, body){
    const res = await fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : undefined);
    let data = null; try{ data = await res.json(); } catch(e){}
    if(!data) throw new Error(`เชื่อมต่อ server ไม่สำเร็จ (${res.status})`);
    if(!data.success) throw new Error(data.message || 'โหลดข้อมูลไม่สำเร็จ');
    return data;
  }
  const IC = {
    refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0114.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0020.5 15"/></svg>',
    open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
  };
  // เรื่อง: ชื่อ / สี (ชิป + แถบการ์ด)
  const MOD = {
    rq: { name: 'ใบขอปรับยอดสต๊อก', short: 'ปรับยอดสต๊อก', c: '#4ea7e0' },
    rts: { name: 'ส่งคืนสินค้า/ลดหนี้ Supplier', short: 'ส่งคืนสินค้า Supplier', c: '#f472b6' },
    ops: { name: 'ขอรับซื้อเมล็ด Over PO', short: 'ขอรับซื้อเมล็ด Over PO', c: '#3ecf8e' }
  };
  // สีขั้น: ชุดเดียวกับหน้าอนุมัติ (รับทราบ ม่วง / ตรวจสอบ ส้ม / อนุมัติ เขียว)
  const stepTone = (code) => /^(ack|accept)$/.test(code) ? 'ack' : /^check/.test(code) ? 'check' : 'approve';

  // แท็บ: named = ระบุชื่อฉัน (Over PO) / role = ตามสิทธิ์ของฉัน / '' = ไม่แบ่ง (มีงานแบบเดียว)
  //   กลุ่มระบบ (ผู้บริหาร / ผู้ดูแลระบบ) เปิดมาที่ ระบุชื่อฉัน เสมอ — งานตามสิทธิ์ของระดับผู้จัดการไม่ปนมา
  let scope = null;
  const SCOPE = { named: 'งานอนุมัติที่ระบุชื่อฉัน', role: 'งานอนุมัติตามสิทธิ์ของฉัน' };
  let stepF = store.get('step') || '';   // ตัวกรองขั้น (รับทราบ / ตรวจสอบ / อนุมัติ) — แสดงเมื่อผู้ใช้มีงานมากกว่า 1 ขั้น
  let data = null, mod = store.get('mod') || '', picked = new Set(), loadSeq = 0, busy = false;

  async function load(){
    const my = ++loadSeq;
    data = null; picked = new Set();
    $('ibBody').innerHTML = '<p class="empty-msg">กำลังโหลด…</p>'; $('ibBulk').innerHTML = ''; $('ibHint').textContent = '';
    try{
      const d = await api('/api/approval-inbox');
      if(my !== loadSeq) return;
      data = d;
      const tabs = d.unrestricted || (d.named > 0 && d.role > 0);
      if(!tabs) scope = '';
      else if(!scope) scope = d.unrestricted || d.named ? 'named' : 'role';
      const comps = [...new Set(d.data.map(x => x.comp).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'th'));
      const keep = $('fComp').value;
      $('fComp').innerHTML = '<option value="">ทุกบริษัท</option>' + comps.map(c => `<option>${esc(c)}</option>`).join('');
      if(comps.includes(keep)) $('fComp').value = keep;
      if(window.WIMSidebar && WIMSidebar.setApprovalBadge) WIMSidebar.setApprovalBadge(d.badge, d.eligible !== false);
      render();
    } catch(err){ if(my === loadSeq) $('ibBody').innerHTML = `<p class="empty-msg">${esc(err.message)}</p>`; }
  }

  // ตัวเลขทุกจุดนับตามตัวกรองที่ใช้อยู่ (บริษัท / ค้นหา / ขั้นตอน / เรื่อง) — การ์ดเรื่องไม่นับตัวกรองเรื่องเอง, ปุ่มขั้นตอนไม่นับตัวกรองขั้นตอนเอง
  const hasTone = (x, t) => x.my.some(s => stepTone(s.code) === t);
  function filtered({ useMod = true, useStep = true } = {}){
    const q = $('fQ').value.trim().toLowerCase(), comp = $('fComp').value;
    let list = data.data.filter(x => (!scope || x.scope === scope) && (!useMod || !mod || x.mod === mod) && (!useStep || !stepF || hasTone(x, stepF)) && (!comp || x.comp === comp)
      && (!q || [x.docNo, x.comp, x.title, x.src, x.by].some(v => String(v || '').toLowerCase().includes(q))));
    if($('fSort').value === 'old') list = list.slice().reverse();
    return list;
  }
  const baseRows = () => filtered({ useStep: false });
  const rows = () => filtered();
  // ขั้นที่ปุ่มของแถวนี้จะพาไป: กรองขั้นอยู่ = ขั้นนั้น / ไม่กรอง = ขั้นแรกที่รอฉัน
  const curStep = (x) => (stepF && x.my.find(s => stepTone(s.code) === stepF)) || x.my[0];
  const hrefOf = (x) => { const s = curStep(x); return /[?&]step=/.test(x.href) ? x.href.replace(/([?&]step=)[^&]*/, '$1' + encodeURIComponent(s.code)) : x.href; };
  const STEP_TONES = [['ack', 'รับทราบ', '#8b72e6'], ['check', 'ตรวจสอบ', '#d97706'], ['approve', 'อนุมัติ', '#22c55e']];
  function steps(){
    const tones = new Set(data.data.filter(x => !scope || x.scope === scope).flatMap(x => x.my.map(s => stepTone(s.code))));
    if(tones.size < 2){ stepF = ''; $('ibSteps').innerHTML = ''; return; }
    const base = baseRows();
    const btn = (k, label, n, c) => `<button type="button" class="${stepF === k ? 'on' : ''}" style="--c:${c}" data-stepf="${k}">${label} <b>${fmtInt(n)}</b></button>`;
    $('ibSteps').innerHTML = `<span class="lb">ขั้นตอน:</span>${btn('', 'ทั้งหมด', base.length, '#f2a91c')}${STEP_TONES.filter(([k]) => tones.has(k)).map(([k, n, c]) => btn(k, n, base.filter(x => hasTone(x, k)).length, c)).join('')}`;
  }

  function scopeTabs(){
    if(scope === ''){ $('ibScope').innerHTML = ''; return; }
    const n = { named: data.named, role: data.role };
    $('ibScope').innerHTML = Object.keys(SCOPE).map(k => `<button type="button" class="${scope === k ? 'on' : ''}" data-scope="${k}">${SCOPE[k]} <b>${fmtInt(n[k])}</b></button>`).join('');
  }
  function dash(){
    const all = filtered({ useMod: false }), c = {};
    all.forEach(x => { c[x.mod] = (c[x.mod] || 0) + 1; });
    // การ์ดเรื่องเฉพาะในแท็บนี้: ระบุชื่อฉัน = Over PO / ตามสิทธิ์ของฉัน = ปรับยอดสต๊อก + ส่งคืนสินค้า
    const inScope = (k) => !scope || (scope === 'named') === (k === 'ops');
    if(mod && !inScope(mod)) mod = '';
    const show = Object.keys(MOD).filter(k => inScope(k) && (data.mods[k] || data.counts[k]));
    const card = (k, label, n, color) => `<button type="button" class="dash-card ${mod === k ? 'active' : ''} ${n ? '' : 'zero'}" style="--c:${color}" data-mod="${k}">
      <span class="lbl">${label}</span><span class="val">${fmtInt(n)}<small>รายการ</small></span></button>`;
    // มีเรื่องเดียว (เช่น แท็บระบุชื่อฉัน = ขอรับซื้อเมล็ด Over PO) → การ์ดรวมใบเดียว ใช้ชื่อเรื่องนั้น (การ์ดเรื่องซ้ำกับยอดรวม)
    if(show.length === 1){ mod = ''; $('ibDash').innerHTML = card('', `รอฉัน · ${MOD[show[0]].short}`, all.length, MOD[show[0]].c); return; }
    $('ibDash').innerHTML = card('', 'รอฉันทั้งหมด', all.length, '#f2a91c') + show.map(k => card(k, MOD[k].short, c[k] || 0, MOD[k].c)).join('');
  }
  const modChip = (x) => `<span class="mod-chip" style="--c:${MOD[x.mod].c}">${esc(MOD[x.mod].short)}</span>`;
  // ปุ่มขั้น: กว้างเท่ากันทุกแถว / ชื่อสั้น
  const stepShort = (n) => String(n).replace('อนุมัติปรับยอด', 'อนุมัติ');
  const myBtn = (x) => { const s = curStep(x); return `<a class="btn btn-sm sb-${stepTone(s.code)}" href="${esc(hrefOf(x))}" title="เปิดเอกสาร ${esc(x.docNo)} — ${esc(s.name)}">${IC.check} ${esc(stepShort(s.name))}</a>`; };
  const progress = (x) => `<div class="prog">${x.progress.map(p => `<span class="${p.done ? 'ok' : ''}">${p.done ? '✓' : '○'} ${esc(p.name)}</span>`).join('')}</div>`;
  function ageChip(x){ const d = daysSince(x.date); return `<span class="age ${d > 30 ? 'a3' : d > 7 ? 'a2' : ''}" title="ส่งเมื่อ ${thStamp(x.date)}">${d ? `ค้าง ${fmtInt(d)} วัน` : 'วันนี้'}</span>`; }
  const detail = (x) => `${esc(x.src || '')}${x.src ? ' · ' : ''}${fmtInt(x.nLine)} รายการ${x.amount != null ? ` · <b>${fmtMoney(x.amount)}</b> บาท` : ''}${x.by ? ` · ${esc(shortName(x.by))}` : ''}`;

  function render(){
    if(!data) return;
    dash(); steps();
    const list = rows(), more = Object.keys(data.more || {}).filter(k => data.more[k]);
    scopeTabs();
    $('ibHint').innerHTML = (scope === 'role' && data.unrestricted ? '<span class="warn">กลุ่มระบบเห็นงานตามสิทธิ์ของทุกเรื่อง — ตัวเลขบนเมนูนับเฉพาะงานที่ระบุชื่อคุณ</span><br>' : '') + `กดรายการเพื่อเปิดเอกสาร แล้วดำเนินการตามขั้นตอนของคุณ — ปิดเอกสารแล้วกลับมาที่หน้านี้${data.can.rqBulk.length && scope !== 'named' ? ' · ใบขอปรับยอดสต๊อก ติ๊กหลายใบแล้วกดขั้นตอนเดียวกันพร้อมกันได้' : ''}`
      + (more.length ? `<br><span class="warn">แสดง 300 ใบล่าสุดของ${more.map(k => MOD[k].name).join(' / ')} — ใบที่เก่ากว่าดูได้ที่หน้าอนุมัติของเรื่องนั้น</span>` : '');
    renderBulk(list);
    if(data.eligible === false){ $('ibBulk').innerHTML = ''; $('ibHint').textContent = ''; $('ibBody').innerHTML = '<div class="ib-empty"><b>คุณไม่มีงานอนุมัติในระบบ</b><span>หน้านี้สำหรับผู้ที่มีสิทธิ์รับทราบ / ตรวจสอบ / อนุมัติ หรือถูกระบุเป็นผู้อนุมัติขอรับซื้อเมล็ด Over PO — ติดต่อผู้ดูแลระบบหากต้องการสิทธิ์</span></div>'; return; }
    if(!data.total){ $('ibBody').innerHTML = '<div class="ib-empty"><b>ไม่มีงานรออนุมัติ</b><span>เมื่อมีเอกสารรอขั้นของคุณ จะแสดงที่นี่ และมีตัวเลขบนเมนู "งานรออนุมัติ"</span></div>'; return; }
    if(!list.length){ $('ibBody').innerHTML = scope === 'named' && !data.named ? '<div class="ib-empty"><b>ไม่มีงานที่ระบุชื่อคุณ</b><span>เอกสารที่ระบุคุณเป็นผู้อนุมัติ (เช่น ขอรับซื้อเมล็ด Over PO) จะแสดงที่นี่</span></div>' : '<p class="empty-msg">ไม่พบรายการตามตัวกรองนี้</p>'; return; }
    const tbl = list.map(x => `<tr data-href="${esc(hrefOf(x))}" style="--c:${MOD[x.mod].c}">
        <td class="c pk-col">${pickBox(x)}</td>
        <td class="act">${myBtn(x)}</td>
        <td>${modChip(x)}<div class="no">${esc(x.docNo)}</div></td>
        <td class="comp">${esc(x.comp || '-')}</td>
        <td class="ttl"><div class="t">${esc(x.title)}</div><div class="s">${detail(x)}</div></td>
        <td class="nw">${thStamp(x.date)}<br>${ageChip(x)}</td>
        <td>${progress(x)}</td></tr>`).join('');
    const cards = list.map(x => `<div class="ib-card" data-href="${esc(hrefOf(x))}" style="--c:${MOD[x.mod].c}">
        <div class="hd"><span class="lft">${pickBox(x)}${modChip(x)}<span class="no">${esc(x.docNo)}</span></span>${ageChip(x)}</div>
        <div class="t">${esc(x.title)}</div>
        <div class="s">${esc(x.comp || '-')}</div><div class="s">${detail(x)}</div>
        ${progress(x)}
        <div class="acts">${myBtn(x)}</div></div>`).join('');
    $('ibBody').innerHTML = `<div class="ib-area"><div class="table-responsive"><table class="ib-table"><thead><tr><th class="pk-col"></th><th>ดำเนินการ</th><th>เรื่อง / เลขที่</th><th>บริษัท</th><th class="lft">รายละเอียด</th><th>วันที่ส่ง</th><th>ความคืบหน้า</th></tr></thead><tbody>${tbl}</tbody></table></div>
      <div class="ib-cards">${cards}</div></div>`;
  }

  // ---------- กดขั้นเดียวกันหลายใบ: ใบขอปรับยอดสต๊อก (rq) / เอกสารส่งคืนสินค้า Supplier (rts) — แยกแถบกัน ไม่ปนในคำสั่งเดียว ----------
  const BULK = {
    rq:  { name: 'ใบขอปรับยอดสต๊อก', steps: { ack: 'รับทราบ', check: 'ตรวจสอบ', approve: 'อนุมัติปรับยอด' }, can: () => data.can.rqBulk },
    rts: { name: 'เอกสารส่งคืนสินค้า Supplier', steps: { ack: 'รับทราบ', check: 'ตรวจสอบ', approve: 'อนุมัติ' }, can: () => data.can.rtsBulk || [] }
  };
  const bkey = (x) => x.mod + ':' + x.id;
  const canBulk = (x) => !!BULK[x.mod] && x.my.some(s => BULK[x.mod].can().includes(s.code));
  const pickBox = (x) => canBulk(x) ? `<input type="checkbox" class="pk" data-pick="${bkey(x)}" ${picked.has(bkey(x)) ? 'checked' : ''} aria-label="เลือก ${esc(x.docNo)}">` : '';
  function renderBulk(list){
    const bars = Object.keys(BULK).map(m => {
      const rows = list.filter(x => x.mod === m && canBulk(x));
      if(!rows.length) return '';
      const B = BULK[m];
      const sel = data.data.filter(x => x.mod === m && picked.has(bkey(x)));
      const by = (k) => sel.filter(x => x.my.some(s => s.code === k));
      const all = rows.every(x => picked.has(bkey(x)));
      return `<div class="bulk ${sel.length ? 'on' : ''}"><label><input type="checkbox" data-pickall="${m}" ${all ? 'checked' : ''}> เลือก${B.name}ทั้งหมด (${rows.length})</label>
        <span class="bi">${sel.length ? `เลือก <b>${sel.length}</b> ใบ` : 'ติ๊กเลือกหลายใบ แล้วกดขั้นพร้อมกัน'}</span>
        <span class="ba">${B.can().map(k => { const n = by(k).length; return `<button type="button" class="btn btn-sm sb-${k} ${n ? 'solid' : ''}" data-bulk="${m}:${k}" ${n ? '' : 'disabled'}>${IC.check} ${B.steps[k]} (${n})</button>`; }).join('')}</span></div>`;
    });
    $('ibBulk').innerHTML = bars.join('');
  }
  function dlg(title, html){ $('dlgTitle').textContent = title; $('dlgBody').innerHTML = html; $('dlgModal').classList.add('show'); }
  const closeDlg = () => { if(!busy) $('dlgModal').classList.remove('show'); };
  const selOf = (m, k) => data.data.filter(x => x.mod === m && picked.has(bkey(x)) && x.my.some(s => s.code === k));
  function bulkDlg(m, k){
    const B = BULK[m], sel = selOf(m, k), nm = B.steps[k];
    let warn = '', rowHtml;
    if(m === 'rq'){
      // ใบที่ขั้นนี้เป็นขั้นสุดท้าย (อีก 2 ขั้นครบแล้ว) = ปรับสต๊อกจริงทันที
      const isLast = (x) => x.progress.filter(p => !p.done).length === 1;
      const nLast = sel.filter(isLast).length;
      if(nLast) warn = `<div class="warn-box"><div><b>${nLast} ใบเป็นขั้นสุดท้าย</b> — กดยืนยันแล้วระบบปรับยอดสต๊อกจริงทันที (ปรับแล้วแก้ได้ด้วยการขอกลับรายการ)</div></div>`;
      rowHtml = (x) => `<div><span class="mono">${esc(x.docNo)}</span><span>${esc(x.comp)} · ${x.nLine} รายการ${isLast(x) ? ' · <b class="lastp">ปรับสต๊อก</b>' : ''}</span></div>`;
    } else {
      const sum = sel.reduce((a, x) => { a.v += Number(x.value || 0); a.c += Number(x.credit || 0); return a; }, { v: 0, c: 0 });
      const fl = (f) => sel.some(x => x.flags && x.flags[f]);
      warn = `<p class="bk-sum">มูลค่าต้นทุนรวม <b>${fmtMoney(sum.v)}</b> บาท${fl('credit') ? ` · ยอดลดหนี้รวม <b>${fmtMoney(sum.c)}</b> บาท` : ''}</p>`
        + (k === 'approve' ? `<div class="warn-box"><div><b>เมื่ออนุมัติ ระบบจะดำเนินการต่อไปนี้ และแก้ไขเอกสารไม่ได้อีก</b><br>${[
            fl('returnGoods') ? '• ส่งรายการไปรอเบิกออกจากคลัง' : '',
            fl('replace') ? '• คืนยอดรับของจาก PO → รอรับสินค้าทดแทน' : '',
            sel.some(x => x.flags && x.flags.credit && !x.flags.noCostAdj) ? '• บันทึกยอดลดหนี้-ปรับปรุงต้นทุน Lot' : '',
            sel.some(x => x.flags && x.flags.noCostAdj) ? '• บันทึกยอดลดหนี้เฉพาะส่วนที่ใช้ไปแล้ว ไม่ปรับต้นทุน Lot' : ''].filter(Boolean).join('<br>')}</div></div>` : '');
      rowHtml = (x) => `<div><span class="mono">${esc(x.docNo)}</span><span>${esc(x.sup || '-')} · ${esc(x.typeName || '')}${x.value != null ? ' · ' + fmtMoney(x.value) : ''}</span></div>`;
    }
    dlg(`${nm} ${sel.length} ใบ`, `
      <p>ยืนยัน<b>${nm}</b>${B.name} ${sel.length} ใบ</p>${warn}
      <div class="bulk-list">${sel.map(rowHtml).join('')}</div>
      ${m === 'rq' ? '<div class="form-group"><label for="bkNote">หมายเหตุ (ถ้ามี)</label><textarea id="bkNote" rows="2" maxlength="500"></textarea></div>' : ''}
      <div class="action-bar"><button type="button" class="btn btn-secondary" data-close="1">ปิด</button><button type="button" class="btn sb-${k} solid" data-bulkgo="${m}:${k}">${IC.check} ยืนยัน${nm}</button></div>`);
  }
  async function bulkGo(m, k, btn){
    const B = BULK[m], nm = B.steps[k], ids = selOf(m, k).map(x => x.id);
    busy = true; btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
    try{
      let results;
      if(m === 'rq'){
        results = (await api('/api/stock-adjust/bulk-step', { step: k, ids, note: $('bkNote').value.trim() })).results;
      } else {
        // เอกสารส่งคืน: ส่งทีละใบ (เหมือนหน้าส่งคืนสินค้า) แต่ละใบบันทึกแยกกัน ใบไหนไม่ผ่านแจ้งเป็นรายใบ
        results = [];
        for(const id of ids){
          try{ await api(`/api/supplier-return/doc/${id}/step`, { step: k }); results.push({ id, ok: true }); }
          catch(err){ results.push({ id, ok: false, message: err.message }); }
        }
      }
      busy = false;
      const bad = results.filter(x => !x.ok), ok = results.length - bad.length, nPost = results.filter(x => x.ok && x.postCode).length;
      if(bad.length){
        const name = new Map(data.data.filter(x => x.mod === m).map(x => [x.id, x.docNo]));
        dlg('ผลการบันทึก', `<p>สำเร็จ <b>${ok}</b> ใบ · ไม่สำเร็จ <b>${bad.length}</b> ใบ</p><div class="bulk-list">${bad.map(x => `<div><span class="mono">${esc(name.get(x.id) || x.id)}</span><span>${esc(x.message)}</span></div>`).join('')}</div>
          <div class="action-bar"><button type="button" class="btn btn-secondary" data-close="1">ปิด</button></div>`);
      } else { closeDlg(); showToast(`บันทึก${nm} ${ok} ใบแล้ว${nPost ? ` · ปรับสต๊อกแล้ว ${nPost} ใบ` : ''}`); }
      picked = new Set();
      load();
    } catch(err){ busy = false; btn.disabled = false; btn.innerHTML = `${IC.check} ยืนยัน${nm}`; showToast(err.message); }
  }

  // ---------- เหตุการณ์ ----------
  document.addEventListener('click', (e) => {
    const t = e.target;
    if(t.closest('[data-close]') || t.id === 'dlgModal'){ closeDlg(); return; }
    const bg = t.closest('[data-bulkgo]'); if(bg){ const [bm, bs] = bg.dataset.bulkgo.split(':'); bulkGo(bm, bs, bg); return; }
    const bk = t.closest('[data-bulk]'); if(bk && !bk.disabled){ const [bm, bs] = bk.dataset.bulk.split(':'); bulkDlg(bm, bs); return; }
    if(t.closest('input[type=checkbox], label, a')) return;
    const sc = t.closest('[data-scope]'); if(sc){ scope = sc.dataset.scope; mod = ''; picked = new Set(); render(); return; }
    const sf = t.closest('[data-stepf]'); if(sf){ stepF = sf.dataset.stepf; store.set('step', stepF); picked = new Set(); render(); return; }
    const m = t.closest('[data-mod]'); if(m){ mod = m.dataset.mod; store.set('mod', mod); picked = new Set(); render(); return; }
    if(t.closest('#btnRefresh')){ load(); return; }
    const row = t.closest('[data-href]'); if(row){ location.href = row.dataset.href; }
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if(t.dataset.pick){ const id = t.dataset.pick; if(t.checked) picked.add(id); else picked.delete(id); render(); }
    else if(t.dataset.pickall){ rows().filter(x => x.mod === t.dataset.pickall && canBulk(x)).forEach(x => t.checked ? picked.add(bkey(x)) : picked.delete(bkey(x))); render(); }
    else if(t.id === 'fComp' || t.id === 'fSort'){ picked = new Set(); render(); }
  });
  let typeTimer = null;
  document.addEventListener('input', (e) => { if(e.target.id !== 'fQ') return; clearTimeout(typeTimer); typeTimer = setTimeout(() => { picked = new Set(); render(); }, 250); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeDlg(); });
  // กลับมาจากหน้าเอกสาร (ปุ่มย้อนกลับของ browser / bfcache) = โหลดใหม่ ให้เห็นงานที่เพิ่งทำไปหายจากรายการ
  window.addEventListener('pageshow', (e) => { if(e.persisted) load(); });
  document.addEventListener('DOMContentLoaded', () => { $('btnRefresh').innerHTML = `${IC.refresh} Refresh`; load(); });
})();
</script>
</body>
</html>
