        <td class="ps">${esc(shortName(d.cmd))}</td><td class="ps">${esc(shortName(d.act))}</td><td class="c"><span class="mono">${esc(d.rqCode || '-')}</span><br>${srcChip(d)}</td><td class="ps">${esc(shortName(d.apv))}</td></tr>
      ${st.open.has(d.id) ? `<tr class="dt-row"><td colspan="10">${dtTable(d)}</td></tr>` : ''}`).join('');
    const cards = list.map(d => `<div class="rp-card" style="--c:${srcColor(d)}">

          <span>ผู้ออกคำสั่ง <b>${esc(shortName(d.cmd))}</b></span><span>ผู้ปฏิบัติงาน <b>${esc(shortName(d.act))}</b></span>
          <span style="grid-column:1/-1">${srcChip(d)} ${d.rqCode ? `<span class="muted">· ${esc(d.rqCode)}</span>` : ''}</span></div>
        ${st.open.has(d.id) ? d.lines.map(l => `<div class="ln-mini"><div class="t"><b>${esc(l.invName)}</b>${opHtml(l.op)}</div><div class="s"><span class="mono" style="color:var(--amber-500)">${esc(l.lotNo)}</span> · ${esc(l.wh || '-')}</div>
          <div class="q"><div>คงเหลือ<b>${fmtQty(l.before)}</b></div><div>เปลี่ยนแปลง<b style="color:${l.op === '-' ? '#ff8a75' : l.op === '=' ? '#c4b5fd' : '#7cc4f0'}">${l.op === '-' ? '−' : l.op === '=' ? '=' : '+'}${fmtQty(l.amount)}</b></div><div>คงเหลือใหม่<b>${fmtQty(l.after)}</b></div></div>${l.note ? `<div class="s">${esc(l.note)}</div>` : ''}${revChip(l)}</div>`).join('') : ''}
        <div class="acts"><button type="button" class="btn btn-secondary btn-sm" data-toggle="${d.id}">${IC.list} ${st.open.has(d.id) ? 'ซ่อนรายการ' : `ดูรายการ (${d.lines.length})`}</button>
          ${d.idRq ? `<button type="button" class="btn btn-secondary btn-sm" data-rq="${d.idRq}" data-rqcode="${esc(d.rqCode)}">${IC.folder} ใบขอปรับ</button>` : ''}${revBtn(d, true)}</div></div>`).join('');

      <div class="rp-area"><div class="table-responsive"><table class="rp-table"><thead><tr><th style="width:44px"></th><th>ลำดับ</th><th>ข้อมูล</th><th>เลขที่รายการ</th><th>วันที่ปรับ</th>
        <th class="lft">เหตุผลการปรับ/ตรวจนับสต๊อก</th><th>ผู้ออกคำสั่ง</th><th>ผู้ปฏิบัติงาน</th><th>ใบขอปรับยอด<br>ที่มา</th><th>ผู้อนุมัติ</th></tr></thead><tbody>${rows}</tbody></table></div>
        <div class="rp-cards">${cards}</div></div>${pager(docs.length, DOC_PAGE)}`;
  }

  // ---------- ตามรายการ (รายงานสรุปข้อมูลการปรับ/ตรวจนับสต็อก) ----------
  const ITEM_COLS = [['date', 'วันที่ปรับ<br>เลขที่รายการ'], ['name', 'ชื่อสินค้า/วัสดุ'], ['lot', 'Lot No.'], ['before', 'จำนวนคงเหลือ'], ['op', 'ตัวดำเนินการ'], ['amount', 'จำนวนที่เปลี่ยนแปลง'],
    ['after', 'จำนวนคงเหลือใหม่'], ['unit', 'หน่วย'], ['wh', 'คลัง'], ['note', 'หมายเหตุ']];
  function itemRows(){
    const rows = data.lines.map(l => ({ l, d: data.byDoc.get(l.doc) }));
    const k = st.sort.key, dir = st.sort.dir;
    if(!k) return rows;
    const v = ({ l, d }) => ({ date: d.date, name: l.invName || '', lot: l.lotNo || '', before: l.before, op: l.op, amount: l.amount, after: l.after, unit: l.unit || '', wh: l.wh || '', note: l.note || '', doc: d.docCode })[k];
    return rows.slice().sort((a, b) => { const x = v(a), y = v(b); return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x ?? '').localeCompare(String(y ?? ''), 'th')) * dir; });
  }

        <td class="n">${fmtQty(l.before)}</td><td class="c">${opHtml(l.op)}</td><td class="n chg">${fmtQty(l.amount)}</td><td class="n new">${fmtQty(l.after)}</td><td class="c">${esc(l.unit || '')}</td>
        <td class="wh">${esc(l.wh || '-')}</td><td class="note">${esc(l.note)}${l.rev ? (l.note ? '<br>' : '') + revChip(l) : ''}</td></tr>`).join('');
    const cards = list.map(({ l, d }) => `<div class="rp-card" style="--c:${l.op === '-' ? '#ff8a75' : l.op === '=' ? '#a78bfa' : '#4ea7e0'}">
        <div class="hd"><b style="color:#fff">${esc(l.invName)}</b>${opHtml(l.op)}</div>
        <div class="s" style="font-size:12.5px;color:var(--concrete-400);margin-top:3px"><span class="mono" style="color:var(--amber-500)">${esc(l.lotNo)}</span> · ${esc(l.wh || '-')}</div>
        <div class="ln-mini" style="margin-top:8px"><div class="q" style="margin-top:0"><div>คงเหลือ<b>${fmtQty(l.before)}</b></div><div>เปลี่ยนแปลง<b style="color:${l.op === '-' ? '#ff8a75' : l.op === '=' ? '#c4b5fd' : '#7cc4f0'}">${l.op === '-' ? '−' : l.op === '=' ? '=' : '+'}${fmtQty(l.amount)}</b></div><div>คงเหลือใหม่<b>${fmtQty(l.after)}</b></div></div></div>
        <div class="mt" style="margin-top:8px"><span>เลขที่เอกสาร <b>${esc(d.docCode)}</b></span><span>หน่วย <b>${esc(l.unit || '-')}</b></span><span class="full">วันที่ปรับ <b>${thStamp(d.date)}</b></span></div>

      <div class="rp-area"><div class="table-responsive"><table class="rp-table items"><thead><tr><th>#</th>${th}</tr></thead><tbody>${rows}</tbody></table></div>
      <div class="rp-cards">${cards}</div></div>${pager(all.length, ITEM_PAGE)}`;
  }

  // ---------- ภาพรวม ----------
  function countBy(keyFn, filterFn){
    const m = new Map();
    data.lines.forEach(l => { if(filterFn && !filterFn(l)) return; const k = keyFn(l); if(!k) return; const x = m.get(k) || { k, n: 0, p: 0, m: 0, s: 0, docs: new Set() }; x.n++; x[l.op === '+' ? 'p' : l.op === '-' ? 'm' : 's']++; x.docs.add(l.doc); m.set(k, x); });
    return [...m.values()].sort((a, b) => b.n - a.n);
  }
  const hbRow = (label, x, mx, sub, click) => `<div class="r ${click ? 'click' : ''}" ${click || ''}><div class="lb"><span>${label}${sub ? `<small>${sub}</small>` : ''}</span><b>${fmtInt(x.n)}</b></div>
    <div class="tr" style="width:${Math.max(4, x.n / mx * 100)}%"><span class="c-p" style="width:${x.p / x.n * 100}%"></span><span class="c-m" style="width:${x.m / x.n * 100}%"></span><span class="c-s" style="width:${x.s / x.n * 100}%"></span></div></div>`;
  function dashView(){
    const L = data.lines, nP = L.filter(l => l.op === '+').length, nM = L.filter(l => l.op === '-').length, nS = L.filter(l => l.op === '=').length;
    const lots = new Set(L.map(l => l.lotNo)).size, items = new Set(L.map(l => l.invCode)).size;
    const kpi = (k, label, v, unit, d, ic) => `<div class="kpi" style="--k:${k}"><div class="l">${label}</div><div class="v">${fmtInt(v)}<small>${unit}</small></div>${d ? `<div class="d">${d}</div>` : ''}${ic.replace('<svg', '<svg class="bg"')}</div>`;
    const pct = (a) => L.length ? (a / L.length * 100).toFixed(0) + '%' : '0%';
    // แนวโน้ม 12 เดือน

      trendHtml = `<div class="legend"><span><i class="c-p"></i>ปรับเพิ่ม</span><span><i class="c-m"></i>ปรับลด</span><span><i class="c-s"></i>ตั้งยอดใหม่</span></div>
        <div class="trend">${trend.months.map(m => { const t = m.plus + m.minus + m.set; return `<div class="col ${inSel(m) ? 'sel' : ''}" data-tmonth="${m.y}-${m.m}" title="${TH_MONTH[m.m - 1]} ${m.y + 543}: ${fmtInt(m.docs)} เอกสาร · เพิ่ม ${fmtInt(m.plus)} · ลด ${fmtInt(m.minus)}${m.set ? ` · ตั้งยอด ${fmtInt(m.set)}` : ''} รายการ — กดเพื่อดูเดือนนี้">
          <span class="tv">${t ? fmtInt(t) : ''}</span><div class="stk" style="height:${t / mx * 100}%"><span class="c-p" style="height:${t ? m.plus / t * 100 : 0}%"></span><span class="c-m" style="height:${t ? m.minus / t * 100 : 0}%"></span><span class="c-s" style="height:${t ? m.set / t * 100 : 0}%"></span></div>
          <span class="ml">${TH_MON[m.m - 1]}</span></div>`; }).join('')}</div>
        <div class="yr-row">${(() => { const g = []; trend.months.forEach(m => { const l = g[g.length - 1]; if(l && l.y === m.y) l.n++; else g.push({ y: m.y, n: 1 }); }); return g.map((x, i) => `<div class="yr y${i % 2}" style="grid-column:span ${x.n}"><span>${x.n >= 2 ? 'พ.ศ. ' : ''}${x.y + 543}</span></div>`).join(''); })()}</div>`;
    }
    const top = countBy(l => l.invCode).slice(0, 10), topMx = Math.max(1, ...top.map(x => x.n));
    const nameOf = new Map(L.map(l => [l.invCode, l.invName]));
    const topHtml = top.length ? `<div class="hb">${top.map((x, i) => hbRow(`<span class="rank">${i + 1}</span>${esc(nameOf.get(x.k) || x.k)}`, x, topMx, `${x.docs.size} เอกสาร`, `data-qitem="${esc(x.k)}" title="ดูรายการของสินค้านี้"`)).join('')}</div>` : '<p class="empty-dash">-</p>';
    const wh = countBy(l => l.mainWh || '(ไม่ระบุคลัง)').slice(0, 10), whMx = Math.max(1, ...wh.map(x => x.n));
    const whId = new Map(L.map(l => [l.mainWh || '(ไม่ระบุคลัง)', l.idWh0]));
    const whHtml = `<div class="hb">${wh.map(x => hbRow(esc(x.k), x, whMx, `${x.docs.size} เอกสาร`, whId.get(x.k) && !$('fWh').value ? `data-wh="${whId.get(x.k)}" title="กรองเฉพาะคลังนี้"` : '')).join('')}</div>`;
    const scLines = L.filter(l => data.byDoc.get(l.doc).src === 'SC');
    const cause = countBy(l => l.cause || '(ไม่ระบุสาเหตุ)', l => data.byDoc.get(l.doc).src === 'SC').slice(0, 10), cMx = Math.max(1, ...cause.map(x => x.n));
    const causeHtml = scLines.length ? `<div class="hb">${cause.map(x => hbRow(esc(x.k), x, cMx, '')).join('')}</div>` : '<p class="empty-dash">ช่วงนี้ไม่มีการปรับจากการตรวจนับบนเว็บ — สาเหตุมีเฉพาะใบจากการตรวจนับ (ใบจาก WIM Desktop เป็นข้อความอิสระ)</p>';
    const nSC = data.docs.filter(d => d.src === 'SC').length, nRV = data.docs.filter(d => d.src === 'REV').length, nPC = data.docs.length - nSC - nRV;

      </div>

          <div class="split">${nSC ? `<span style="width:${nSC / data.docs.length * 100}%;background:#a78bfa">${nSC / data.docs.length >= .12 ? `ตรวจนับ ${fmtInt(nSC)}` : ''}</span>` : ''}${nPC ? `<span style="width:${nPC / data.docs.length * 100}%;background:#4ea7e0">${nPC / data.docs.length >= .12 ? `WIM Desktop ${fmtInt(nPC)}` : ''}</span>` : ''}${nRV ? `<span style="width:${nRV / data.docs.length * 100}%;background:#fb923c">${nRV / data.docs.length >= .12 ? `กลับรายการ ${fmtInt(nRV)}` : ''}</span>` : ''}</div>

  // ---------- ใบขอปรับยอดสต๊อก: เปิดซ้อน (iframe หน้าอนุมัติโหมดฝัง) — พิมพ์ / ปิด ----------

  function filterText(f){

  // ---------- Export Excel (ตามมุมมองที่เปิด: ตามเอกสาร = 2 ชีต หัวเอกสาร + รายการ / ตามรายการ = 1 ชีต) ----------
  const xlsQtyFmt = (v) => isTinyQty(Number(v || 0)) ? '#,##0.00####' : '#,##0.00';
  async function exportExcel(btn){
    if(!data || !data.lines.length){ showToast('ยังไม่มีข้อมูล — กดแสดงข้อมูลก่อน'); return; }

      const wb = new ExcelJS.Workbook(), f = applied, title = st.view === 'item' ? 'ตามรายการ' : 'ตามเอกสาร';
      const thin = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } }, hair = { top: { style: 'hair' }, left: { style: 'hair' }, bottom: { style: 'hair' }, right: { style: 'hair' } };
      const sheet = (name, cols, widths, rows, fmt) => {
        const ws = wb.addWorksheet(name, { views: [{ state: 'frozen', ySplit: 5 }] });
        ws.columns = widths.map(w => ({ width: w }));
        // หัวรายงานมาตรฐานของระบบ (WIMExcel): แถบชื่อ + Export Date/By + กรอบเงื่อนไข
        const info = [['วันที่ปรับ', periodText(f)], ['มุมมอง', title]];
        filterText(f).forEach(t => { const i = t.indexOf(': '); info.push(i > 0 ? [t.slice(0, i), t.slice(i + 2)] : ['ตัวกรอง', t]); });
        const hr0 = WIMExcel.header(ws, cols.length, { title: `รายงานการปรับยอดสต๊อก (${title})`, titleEn: 'STOCK ADJUSTMENT REPORT', info });
        const hr = ws.getRow(hr0); hr.values = cols; hr.height = 30;
        hr.eachCell(c => { c.font = { bold: true }; c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD5DEEA' } }; c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true }; c.border = thin; });
        rows.forEach(r => { const row = ws.addRow(r); row.eachCell({ includeEmpty: true }, c => { c.border = hair; c.alignment = { vertical: 'top', wrapText: true }; }); if(fmt) fmt(row, r); });
        ws.autoFilter = { from: { row: hr0, column: 1 }, to: { row: hr0, column: cols.length } };
        ws.views = [{ state: 'frozen', ySplit: hr0 }];
        return ws;
      };
      const qtyCells = (row, idx) => idx.forEach(([i, v]) => { const c = row.getCell(i); c.numFmt = xlsQtyFmt(v); c.alignment = { horizontal: 'right', vertical: 'top' }; });
      if(st.view === 'item'){

        sheet('ตามรายการ', ['#', 'วันที่ปรับ', 'ชื่อสินค้า/วัสดุ', 'Lot No.', 'จำนวนคงเหลือ', 'ตัวดำเนินการ', 'จำนวนที่เปลี่ยนแปลง', 'จำนวนคงเหลือใหม่', 'หน่วย', 'คลัง', 'หมายเหตุ', 'เลขที่รายการ', 'รหัสสินค้า'],
          [6, 19, 40, 20, 14, 10, 14, 14, 10, 30, 36, 14, 14],
          rows.map(({ l, d }, i) => [i + 1, thStampSec(d.date), l.invName, l.lotNo, l.before, l.op, l.amount, l.after, l.unit, l.wh, l.note, d.docCode, l.invCode]),
          (row, r) => { qtyCells(row, [[5, r[4]], [7, r[6]], [8, r[7]]]); row.getCell(6).alignment = { horizontal: 'center', vertical: 'top' }; row.getCell(7).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF6D6' } }; row.getCell(8).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFDE7F1' } }; });
      } else {
        const docs = [...data.byDoc.values()];
        sheet('หัวเอกสาร', ['ลำดับ', 'เลขที่รายการ', 'วันที่ปรับ', 'เหตุผลการปรับ/ตรวจนับสต๊อก', 'ผู้ออกคำสั่ง', 'ผู้ปฏิบัติงาน', 'ใบขอปรับยอด', 'ที่มา', 'ผู้อนุมัติ', 'จำนวนรายการ'],
          [7, 14, 13, 44, 26, 26, 15, 22, 26, 12],
          docs.map((d, i) => [i + 1, d.docCode, thDate(d.date), d.note, d.cmd, d.act, d.rqCode, srcText(d), d.apv, d.lines.length]));
        sheet('รายการ', ['เลขที่รายการ', 'วันที่ปรับ', 'Lot No.', 'ชื่อสินค้า', 'คลัง', 'จำนวนคงเหลือ', 'ตัวดำเนินการ', 'จำนวนที่เปลี่ยนแปลง', 'จำนวนคงเหลือใหม่', 'หน่วย', 'หมายเหตุ'],
          [14, 13, 20, 40, 30, 14, 10, 14, 14, 10, 36],
          docs.flatMap(d => d.lines.map(l => [d.docCode, thDate(d.date), l.lotNo, l.invName, l.wh, l.before, l.op, l.amount, l.after, l.unit, l.note])),
          (row, r) => { qtyCells(row, [[6, r[5]], [8, r[7]], [9, r[8]]]); row.getCell(7).alignment = { horizontal: 'center', vertical: 'top' }; row.getCell(8).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF6D6' } }; row.getCell(9).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFDE7F1' } }; });

      const a = document.createElement('a'); a.href = url; a.download = `รายงานการปรับยอดสต๊อก_${title}_${periodText(f).replace(/[\\/:*?"<>| ]+/g, '-')}.xlsx`;

  // ---------- พิมพ์รายงาน (A4 แนวนอน, Chromium) — แบ่งหน้าเอง หัวรายงาน + หัวตารางซ้ำทุกหน้า ----------
  const PAGE_MM = { P: [194, 279], L: [281, 192] };
  const MMPX = 96 / 25.4;
  const tableHtml = (p, rows) => `<div class="ps-part"><table class="${p.cls || ''}"><colgroup>${p.cols.map(w => `<col style="width:${w}%">`).join('')}</colgroup>
      <thead>${p.thead}</thead><tbody>${rows.map(x => x.html).join('')}</tbody></table></div>`;
  let printSeq = 0;
  async function pagedHtml({ landscape, head, parts, foot }){
    printSeq++;
    const [w, h] = PAGE_MM[landscape ? 'L' : 'P'];
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const pa = $('printArea'), keep = pa.getAttribute('style');
    pa.style.cssText = `display:block; position:absolute; left:-10000px; top:0; width:${w}mm; visibility:hidden;`;
    pa.innerHTML = `<div class="m-head ps-part">${head}</div><div class="m-foot ps-pfoot ps-part">${foot(1, 1)}</div><div class="m-cont ps-cont">มีต่อหน้าถัดไป</div>`
      + parts.map((p, i) => `<div class="m-part" data-i="${i}">${p.rows ? tableHtml(p, p.rows) : `<div class="ps-part">${p.html}</div>`}</div>`).join('');
    const H = (el) => el.getBoundingClientRect().height;
    const contEl = pa.querySelector('.m-cont'), headH = H(pa.querySelector('.m-head')), footH = H(pa.querySelector('.m-foot')) + H(contEl) + parseFloat(getComputedStyle(contEl).marginTop);
    const meas = parts.map((p, i) => {
      const el = pa.querySelector(`.m-part[data-i="${i}"]`);
      if(!p.rows) return { h: H(el) };
      const rowsH = [...el.querySelectorAll('tbody > tr')].map(H);
      return { base: H(el) - rowsH.reduce((a, b) => a + b, 0), rowsH };
    });
    pa.innerHTML = '';
    if(keep == null) pa.removeAttribute('style'); else pa.setAttribute('style', keep);
    const avail = h * MMPX - headH - footH - 4;
    const pages = []; let cur = [], used = 0;
    const newPage = () => { pages.push(cur); cur = []; used = 0; };
    parts.forEach((p, i) => {
      const m = meas[i];
      if(!p.rows){ if(used && used + m.h > avail) newPage(); cur.push(`<div class="ps-part">${p.html}</div>`); used += m.h; return; }
      const groups = [];
      for(let k = 0; k < p.rows.length; k++){ const g = [k]; while(p.rows[g[g.length - 1]].keep && g[g.length - 1] + 1 < p.rows.length) g.push(g[g.length - 1] + 1); groups.push(g); k = g[g.length - 1]; }
      let chunk = [];
      const flush = () => { if(chunk.length){ cur.push(tableHtml(p, chunk.map(k => p.rows[k]))); chunk = []; } };
      groups.forEach(g => {
        const gh = g.reduce((a, k) => a + m.rowsH[k], 0), need = gh + (chunk.length ? 0 : m.base);
        if(used && used + need > avail){ flush(); newPage(); }
        if(!chunk.length) used += m.base;
        chunk.push(...g); used += gh;
      });
      flush();
    });
    pages.push(cur);
    const n = pages.length;
    return pages.map((body, k) => `<div class="ps-pg" style="height:${h}mm"><div class="ps-part">${head}</div><div class="ps-body">${body.join('')}${k < n - 1 ? '<div class="ps-cont">มีต่อหน้าถัดไป</div>' : ''}</div><div class="ps-pfoot ps-part">${foot(k + 1, n)}</div></div>`).join('');
  }
  function doPrint(html){
    const my = ++printSeq;
    $('printArea').innerHTML = html;
    const imgs = [...$('printArea').querySelectorAll('img')].filter(i => !i.complete);
    if(imgs.length) showToast('กำลังเตรียมเอกสารสำหรับพิมพ์…');
    const ready = Promise.race([Promise.all(imgs.map(i => new Promise(ok => { i.addEventListener('load', ok); i.addEventListener('error', ok); }))), new Promise(ok => setTimeout(ok, 3000))]);
    return ready.then(() => new Promise(res => setTimeout(() => {
      if(my !== printSeq) return res(false);
      let t = null;
      const pageStyle = document.createElement('style'); pageStyle.textContent = '@page{size:A4 landscape; margin:8mm;}'; document.head.appendChild(pageStyle);
      const done = () => { window.removeEventListener('afterprint', done); clearTimeout(t); if(my === printSeq) document.body.classList.remove('printing'); pageStyle.remove(); res(true); };
      document.body.classList.add('printing');
      window.addEventListener('afterprint', done);
      window.print();
      t = setTimeout(done, 1500);
    }, 60)));
  }
  const PRINT_MAX = 3000;
  async function printReport(btn){
    if(!data || !data.lines.length){ showToast('ยังไม่มีข้อมูล — กดแสดงข้อมูลก่อน'); return; }
    if(data.lines.length > PRINT_MAX && !confirm(`ข้อมูล ${fmtInt(data.lines.length)} รายการ (ประมาณ ${fmtInt(Math.ceil(data.lines.length / 22))} หน้า) — พิมพ์ต่อหรือไม่?\nแนะนำ: เลือกช่วงวันที่ให้แคบลง หรือใช้ Export Excel`)) return;
    const h = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'กำลังเตรียม…';
    try{
      const f = applied, isItem = st.view === 'item', L = data.lines;
      const comp = meta.companies.find(x => String(x.id) === f.idComp);
      const nP = L.filter(l => l.op === '+').length, nM = L.filter(l => l.op === '-').length, nS = L.length - nP - nM;
      const stamp = thStamp(new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString());
      const R = WIMReport, e = R.esc;
      const op = (o) => o === '-' ? '−' : e(o);
      const info = [['วันที่ปรับ', e(periodText(f))], ['มุมมอง', isItem ? 'ตามรายการ' : 'ตามเอกสาร'], ['เอกสาร / รายการที่ปรับ', fmtInt(data.docs.length) + ' ใบ / ' + fmtInt(L.length) + ' รายการ'],
        ['ปรับเพิ่ม / ปรับลด' + (nS ? ' / ตั้งยอดใหม่' : ''), fmtInt(nP) + ' / ' + fmtInt(nM) + (nS ? ' / ' + fmtInt(nS) : '')]];
      const fl = filterText(f).slice(1); if(fl.length) info.push(['เงื่อนไข', e(fl.join(' · '))]);
      let body;
      if(isItem){
        body = R.table({ cols: [3, 11, 19, 13, 7, 4.5, 7, 7, 6, 12, 10.5],
          head: ['#', 'วันที่ปรับ', 'ชื่อสินค้า/วัสดุ', 'Lot No.', 'คงเหลือ', 'ตัวดำเนินการ', 'จำนวนที่ปรับ', 'คงเหลือใหม่', 'หน่วย', 'คลัง', 'หมายเหตุ'],
          align: ['c', 'l', 'l', 'l', 'r', 'c', 'r', 'r', 'c', 'l', 'l'],
          rows: itemRows().map(({ l, d }, i) => [i + 1, { h: e(thStampSec(d.date)), cls: 'nw' }, e(l.invName), e(l.lotNo), fmtQty(l.before), op(l.op), fmtQty(l.amount), fmtQty(l.after), e(l.unit || ''), e(l.wh || '-'), e(l.note)]) });
      } else {
        const rows = [];
        [...data.byDoc.values()].forEach((d, i) => {
          rows.push([i + 1, { h: '<b>' + e(d.docCode) + '</b> · ' + e(thDate(d.date)) + ' · ' + e(d.note || '-') + ' · ผู้ออกคำสั่ง ' + e(shortName(d.cmd)) + ' · ผู้ปฏิบัติงาน ' + e(shortName(d.act)) + (d.rqCode ? ' · ' + e(d.rqCode) : ''), span: 9 }]);
          d.lines.forEach((l) => rows.push(['', e(l.lotNo), e(l.invName), e(l.wh || '-'), fmtQty(l.before), op(l.op), fmtQty(l.amount), fmtQty(l.after), e(l.unit || ''), e(l.note)]));
        });
        body = R.table({ cols: [5, 13.5, 23.5, 14, 7.5, 5, 8, 8, 6, 9.5],
          head: ['ลำดับ', 'Lot No.', 'ชื่อสินค้า', 'คลัง', 'คงเหลือ', 'ตัวดำเนินการ', 'จำนวนที่ปรับ', 'คงเหลือใหม่', 'หน่วย', 'หมายเหตุ'],
          align: ['c', 'l', 'l', 'l', 'r', 'c', 'r', 'r', 'c', 'l'], rows });
      }
      R.print({ orient: 'landscape', title: 'รายงานการปรับยอดสต๊อก', titleEn: 'Stock Adjustment Report · ' + (isItem ? 'By Item' : 'By Document'),
        company: { id: comp ? comp.id : '', name: comp ? comp.name : '' }, info, body });
    } finally{ btn.disabled = false; btn.innerHTML = h; }
  }

  // ---------- เหตุการณ์ ----------
  document.addEventListener('click', (e) => {
    const t = e.target;
    if(t.closest('[data-closerqv]') || t.id === 'rqViewModal'){ closeRqView(); return; }
    if(t.closest('[data-printrqv]')){ printRqView(); return; }
    const rq = t.closest('[data-rq]'); if(rq){ e.stopPropagation(); openRqView(rq.dataset.rq, rq.dataset.rqcode); return; }
    const rv = t.closest('[data-rev]'); if(rv){ e.stopPropagation(); AdjReverse.open(rv.dataset.rev, { onDone: () => load() }); return; }
    const dm = t.closest('[data-dmode]'); if(dm){ if(st.dmode !== dm.dataset.dmode){ st.dmode = dm.dataset.dmode; renderDateFields(); if(!$('fDoc').value.trim()) reload(); } return; }
    const v = t.closest('[data-view]'); if(v){ st.view = v.dataset.view; store.set('view', st.view); st.page = 1; render(); return; }
    const tg = t.closest('[data-toggle]'); if(tg){ const id = Number(tg.dataset.toggle); if(st.open.has(id)) st.open.delete(id); else st.open.add(id); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
    const ea = t.closest('[data-expandall]'); if(ea){ const docs = [...data.byDoc.values()].slice((st.page - 1) * DOC_PAGE, st.page * DOC_PAGE); docs.forEach(d => ea.dataset.expandall === '1' ? st.open.add(d.id) : st.open.delete(d.id)); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
    const pg = t.closest('[data-page]'); if(pg && !pg.disabled){ st.page = Number(pg.dataset.page); render(); $('viewTabs').scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
    const so = t.closest('[data-sort]'); if(so){ const k = so.dataset.sort; st.sort = st.sort.key === k ? { key: k, dir: -st.sort.dir } : { key: k, dir: 1 }; st.page = 1; render(); return; }
    const qi = t.closest('[data-qitem]'); if(qi){ $('fQ').value = qi.dataset.qitem; st.view = 'item'; store.set('view', 'item'); load(); return; }
    const wh = t.closest('[data-wh]'); if(wh){ $('fWh').value = wh.dataset.wh; load(); return; }
    const tm = t.closest('[data-tmonth]'); if(tm){ const [y, m] = tm.dataset.tmonth.split('-').map(Number); st.dmode = 'month'; st.year = y; st.month = m; $('fDoc').value = ''; renderDateFields(); reload(0); return; }
    if(t.closest('#btnShow')){ load(); return; }
    const x = t.closest('#btnXls'); if(x){ exportExcel(x); return; }
    const p = t.closest('#btnPrint'); if(p){ printReport(p); return; }
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if(t.id === 'dMonth') st.month = Number(t.value);
    else if(t.id === 'dYear') st.year = Number(t.value);
    else if(t.id === 'dFrom' || t.id === 'dTo'){ st[t.id === 'dFrom' ? 'from' : 'to'] = t.value || isoDate(now); const x = $(t.id + 'Text'); x.textContent = t.value ? thDate(t.value) : 'วว/ดด/ปปปป'; x.classList.toggle('empty', !t.value); }
    else if(t.id === 'fComp') fillWh();
    else if(!['fGroup', 'fWh', 'fOp'].includes(t.id)) return;
    // วันที่ไม่มีผลเมื่อค้นด้วยเลขที่รายการ
    if(['dMonth', 'dYear', 'dFrom', 'dTo'].includes(t.id) && $('fDoc').value.trim()) return;
    reload();
  });
  // ช่องพิมพ์ (สินค้า / เลขที่รายการ): โหลดใหม่เมื่อหยุดพิมพ์ หรือกด Enter
  let typeTimer = null, typed = { fQ: '', fDoc: '' };
  document.addEventListener('input', (e) => {
    const id = e.target.id; if(id !== 'fQ' && id !== 'fDoc') return;
    clearTimeout(typeTimer);
    typeTimer = setTimeout(() => { const v = e.target.value.trim(); if(v !== typed[id]){ typed[id] = v; reload(0); } }, 600);
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && $('rqViewModal').classList.contains('show')) closeRqView();
    if(e.key === 'Enter' && (e.target.id === 'fQ' || e.target.id === 'fDoc')){ clearTimeout(typeTimer); typed[e.target.id] = e.target.value.trim(); reload(0); }
  });
  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
