<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIM — หน้าหลัก</title>
<link rel="icon" href="images/WIMicon.ico" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#0c1420;
    --navy-900:#111d2e;
    --navy-800:#182a40;
    --navy-850:#0f1a29;
    --steel-700:#25405c;
    --steel-500:#4a6b8a;
    --concrete-200:#e7e4da;
    --concrete-400:#b9b4a5;
    --amber-500:#f2a91c;
    --amber-600:#d8930c;
    --safety-red:#e5533d;
    --ok-green:#3ecf8e;
    --radius:10px;
    --sidebar-w:270px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    font-family:'Inter',sans-serif;
    background:var(--navy-950);
    color:var(--concrete-200);
    min-height:100vh;
    overflow-x:hidden;
  }

  .app-shell{display:flex; min-height:100vh;}

  /* ---------- Sidebar (เหมือนหน้าอื่น) ---------- */
  .sidebar{
    width:var(--sidebar-w); flex-shrink:0;
    background:linear-gradient(180deg, var(--navy-900), var(--navy-850));
    border-right:1px solid rgba(255,255,255,.07);
    display:flex; flex-direction:column;
    position:fixed; top:0; left:0; bottom:0; z-index:20;
    transition:transform .25s ease;
  }

  .sidebar-head{
    display:flex; align-items:center; gap:12px;
    padding:22px 20px; border-bottom:1px solid rgba(255,255,255,.07);
  }
  .brand-mark{
    width:38px; height:38px; border:2px solid var(--amber-500); border-radius:6px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    font-family:'Oswald',sans-serif; font-weight:700; color:var(--amber-500); font-size:15px;
    transform:rotate(-3deg);
  }
  .brand-text{font-family:'Oswald',sans-serif; letter-spacing:.05em; font-size:16.5px; font-weight:600; color:var(--concrete-200); line-height:1.2;}
  .brand-text small{display:block; font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.08em; color:var(--steel-500); font-weight:400; margin-top:2px;}

  .side-nav{flex:1; padding:16px 12px; overflow-y:auto;}
  .nav-section-label{
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em;
    color:var(--steel-500); text-transform:uppercase; padding:6px 12px 8px;
  }

  .nav-item{
    width:100%; display:flex; align-items:center; gap:12px;
    padding:11px 12px; border-radius:8px; margin-bottom:2px;
    color:var(--concrete-200); text-decoration:none;
    font-size:14px; font-family:'Inter',sans-serif; font-weight:500;
    background:none; border:none; cursor:pointer; text-align:left;
    transition:background .15s, color .15s;
  }
  .nav-item:hover{background:rgba(255,255,255,.05); color:#fff;}
  .nav-item.active{background:rgba(242,169,28,.12); color:var(--amber-500);}
  .nav-icon{width:19px; height:19px; flex-shrink:0; color:var(--amber-500); opacity:.9;}
  .nav-icon svg{width:100%; height:100%; stroke-width:1.8;}
  .nav-label{flex:1;}
  .nav-chevron{
    width:14px; height:14px; flex-shrink:0; color:var(--steel-500);
    transition:transform .2s ease;
  }
  .nav-group.open .nav-chevron{transform:rotate(180deg);}
  .nav-group.open > .nav-parent{background:rgba(255,255,255,.04);}

  .nav-submenu{
    display:grid; grid-template-rows:0fr; overflow:hidden;
    transition:grid-template-rows .22s ease;
  }
  .nav-group.open .nav-submenu{grid-template-rows:1fr;}
  .nav-submenu-inner{overflow:hidden; padding-left:14px; margin:2px 0 6px;}

  .nav-subitem{
    display:flex; align-items:center; gap:10px;
    padding:9px 12px 9px 20px; border-radius:7px; margin-bottom:1px;
    color:var(--concrete-400); text-decoration:none; font-size:13px;
    position:relative; transition:background .15s, color .15s;
    border-left:1px solid rgba(255,255,255,.09);
  }
  .nav-subitem::before{
    content:""; position:absolute; left:-1px; top:50%; width:12px; height:1px;
    background:rgba(255,255,255,.09);
  }
  .nav-subitem:hover{background:rgba(255,255,255,.05); color:#fff;}
  .nav-subitem.active{color:var(--amber-500); border-left-color:var(--amber-500);}

  .sidebar-foot{
    padding:16px; border-top:1px solid rgba(255,255,255,.07);
    display:flex; flex-direction:column; gap:10px;
  }
  .user-chip{
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-family:'JetBrains Mono',monospace; font-size:13.5px; font-weight:700; color:#ffffff;
    border:1px solid rgba(255,255,255,.15); padding:11px 14px; border-radius:9px;
    background:rgba(255,255,255,.04);
  }
  .user-chip .dot{width:8px; height:8px; border-radius:50%; background:var(--ok-green); box-shadow:0 0 8px var(--ok-green); animation:pulse 2s infinite; flex-shrink:0;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  #userLabel{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .logout-btn{
    font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; letter-spacing:.05em;
    color:#ffffff; background:rgba(255,255,255,.02);
    border:1px solid rgba(255,255,255,.2); border-radius:8px;
    padding:11px 14px; cursor:pointer; text-transform:uppercase;
    transition:border-color .15s, color .15s, background .15s;
    width:100%; text-align:center; text-decoration:none;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .logout-btn:hover{border-color:var(--safety-red); color:#ff8a75; background:rgba(255,60,60,.08);}

  .main-wrap{flex:1; margin-left:var(--sidebar-w); min-width:0;}

  .topbar-mobile{
    display:none; align-items:center; gap:14px;
    padding:16px 20px; border-bottom:1px solid rgba(255,255,255,.07);
    position:sticky; top:0; background:var(--navy-950); z-index:15;
  }
  .hamburger{
    width:38px; height:38px; border-radius:8px; border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.03); color:var(--concrete-200); cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .hamburger svg{width:18px; height:18px;}

  main{
    max-width:1180px; margin:0 auto;
    padding:clamp(28px,4vw,48px) clamp(16px,4vw,48px) 70px;
  }

  /* ---------- หน้า Home ---------- */
  .home-head{
    display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.08em;
    color:var(--amber-500); margin:0 0 10px;
  }
  h1{
    font-family:'Oswald',sans-serif; font-weight:600;
    font-size:clamp(24px,3.4vw,34px); line-height:1.2; margin:0; color:#fff;
  }

  .search-btn{
    display:flex; align-items:center; gap:10px; min-width:260px;
    padding:11px 14px; border-radius:10px; cursor:pointer;
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1);
    color:var(--concrete-400); font:inherit; font-size:13.5px; text-align:left;
    transition:border-color .15s, background .15s;
  }
  .search-btn:hover{border-color:rgba(242,169,28,.45); background:rgba(255,255,255,.06);}
  .search-btn svg{width:16px; height:16px; color:var(--steel-500); flex-shrink:0;}
  .search-btn span{flex:1;}
  kbd{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--concrete-400);
    border:1px solid rgba(255,255,255,.15); border-bottom-width:2px; border-radius:5px; padding:1px 6px;
  }

  .section-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin:34px 0 14px;
  }
  .section-label{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em;
    color:var(--steel-500); text-transform:uppercase; margin:0;
  }
  .updated-at{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--steel-500);}

  /* KPI */
  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:16px;}
  .kpi-card{
    display:flex; flex-direction:column; gap:6px;
    padding:20px 20px 18px; border-radius:var(--radius); text-decoration:none; color:inherit;
    background:linear-gradient(180deg, var(--navy-900), var(--navy-800));
    border:1px solid rgba(255,255,255,.08);
    transition:transform .18s, border-color .18s, box-shadow .18s;
  }
  .kpi-card:hover{border-color:rgba(242,169,28,.3);}
  /* Live Status: การ์ดยกขึ้นเมื่อชี้ + สีตามกลุ่มเมนู (ชุดเดียวกับการ์ดเมนูด้านล่าง) */
  body .kpi-card{transition:transform .18s ease, border-color .18s, box-shadow .18s;}
  body .kpi-card:hover{transform:translateY(-2px); box-shadow:0 14px 30px -16px color-mix(in srgb, var(--c) 70%, transparent);}
  .kpi-top{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  /* ไอคอนแบบแอป: กล่องสีเต็มไล่เฉด + ไอคอนขาว (แบบเดียวกับการ์ดเมนู) */
  .kpi-icon{
    --c:#f2a91c; width:40px; height:40px; border-radius:11px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:#fff;
    background:linear-gradient(145deg, color-mix(in srgb, var(--c) 100%, #fff 18%), color-mix(in srgb, var(--c) 100%, #000 38%));
    border:1px solid color-mix(in srgb, var(--c) 100%, #fff 25%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 6px 14px -6px color-mix(in srgb, var(--c) 80%, transparent);
    transition:transform .2s ease;
  }
  .kpi-card .kpi-icon{--c:inherit;}
  .kpi-card:hover .kpi-icon{transform:scale(1.06) rotate(-4deg);}
  .kpi-icon svg{width:20px; height:20px; stroke-width:2.1; filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));}
  .kpi-label{font-size:14px; font-weight:700; color:#fff;}
  @media (prefers-reduced-motion:reduce){ body .kpi-card, .kpi-icon{transition:none;} body .kpi-card:hover{transform:none;} .kpi-card:hover .kpi-icon{transform:none;} }
  .live-dot{
    width:7px; height:7px; border-radius:50%; background:var(--ok-green);
    box-shadow:0 0 8px var(--ok-green); animation:pulse 2s infinite; margin-left:auto;
  }
  .kpi-value{
    font-family:'Oswald',sans-serif; font-size:40px; font-weight:600; line-height:1.05; color:#fff;
    font-variant-numeric:tabular-nums;
  }
  .kpi-value small{font-family:'Inter',sans-serif; font-size:13px; font-weight:500; color:var(--concrete-400); margin-left:6px;}
  .kpi-value.zero{color:var(--steel-500);}
  .kpi-sub{font-size:12.8px; color:var(--concrete-400); display:flex; flex-wrap:wrap; gap:4px 14px;}
  .kpi-sub b{color:var(--concrete-200); font-weight:600; font-variant-numeric:tabular-nums;}
  .kpi-sub .warn b{color:#ff8a75;}
  /* ยอดแยกรายบริษัท: กดแล้วเปิดหน้าโดยเลือกบริษัทนั้นไว้ให้ */
  .comp-list{
    display:flex; flex-direction:column; gap:2px;
    margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,.07);
  }
  .comp-list-label{font-size:11.5px; color:var(--steel-500); margin-bottom:4px;}
  .comp-row{
    display:flex; align-items:center; gap:10px; padding:7px 8px; margin:0 -8px; border-radius:7px;
    text-decoration:none; color:var(--concrete-200); font-size:12.8px;
    transition:background .15s;
  }
  .comp-row:hover{background:rgba(255,255,255,.05);}
  .comp-row .ctext{flex:1; min-width:0;}
  .comp-row .cname{display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .comp-row .cnum{display:block; color:var(--concrete-400); font-size:12.3px; margin-top:1px; font-variant-numeric:tabular-nums;}
  .comp-row .cnum b{color:#fff; font-weight:600;}
  .comp-row .arrow{color:var(--steel-500); transition:transform .15s, color .15s;}
  .comp-row:hover .arrow{transform:translateX(3px); color:var(--c, var(--amber-500));}
  .comp-none{font-size:12.8px; color:var(--steel-500); padding:4px 0;}
  .comp-tag{
    display:inline-flex; align-self:flex-start; align-items:center; gap:6px; margin-bottom:4px;
    padding:3px 10px; border-radius:999px; font-size:12px; color:var(--concrete-400);
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
  }
  .comp-tag::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--c, var(--amber-500));}

  .kpi-cta{
    margin-top:auto; padding-top:12px; border-top:1px solid rgba(255,255,255,.07);
    font-size:12.8px; font-weight:600; color:var(--c, var(--amber-500)); text-decoration:none;
    display:flex; align-items:center; justify-content:space-between;
  }
  .kpi-cta .arrow{transition:transform .18s;}
  .kpi-cta:hover .arrow{transform:translateX(4px);}
  .comp-list + .kpi-cta{margin-top:10px;}

  .skeleton{
    border-radius:var(--radius); min-height:178px;
    background:linear-gradient(90deg, rgba(255,255,255,.03) 25%, rgba(255,255,255,.07) 50%, rgba(255,255,255,.03) 75%);
    background-size:200% 100%; animation:shimmer 1.4s infinite;
  }
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

  /* ใช้ล่าสุด */
  .recent-row{display:flex; flex-wrap:wrap; gap:10px;}
  .recent-chip{
    display:flex; align-items:center; gap:8px; padding:8px 14px 8px 10px; border-radius:999px;
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1);
    color:var(--concrete-200); text-decoration:none; font-size:13px;
    transition:border-color .15s, background .15s;
  }
  .recent-chip{--c:#f2a91c; border-color:color-mix(in srgb, var(--c) 35%, transparent); background:color-mix(in srgb, var(--c) 7%, transparent);}
  .recent-chip:hover{border-color:var(--c); background:color-mix(in srgb, var(--c) 16%, transparent); color:#fff;}
  .recent-chip svg{width:16px; height:16px; color:var(--c); stroke-width:1.8;}

  /* เมนูของฉัน — สีประจำกลุ่มเมนูหลัก (--c, ใส่จาก groupColor ใน script) แบบเดียวกับการ์ดสรุป:
     พื้นไล่สีอ่อน + กรอบสี + ไอคอนในกล่องสี / ชี้ = ยกขึ้น + เรืองสี + ลูกศรเลื่อน */
  .group-label{--c:#f2a91c; display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700; color:#fff; margin:28px 0 12px;}
  .group-label:first-child{margin-top:0;}
  .group-label::before{content:""; width:4px; height:18px; border-radius:3px; background:var(--c); box-shadow:0 0 12px color-mix(in srgb, var(--c) 60%, transparent); flex-shrink:0;}
  .group-label .sub{font-weight:500; color:var(--concrete-400);}
  .group-label .sub::before{content:"›"; margin-right:8px; color:var(--steel-500);}
  .group-label .n{margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:600; color:var(--c);
    padding:2px 9px; border-radius:999px; background:color-mix(in srgb, var(--c) 12%, transparent); border:1px solid color-mix(in srgb, var(--c) 35%, transparent);}
  .group-label::after{content:""; order:2; flex:1; height:1px; background:linear-gradient(90deg, color-mix(in srgb, var(--c) 35%, transparent), transparent);}
  .group-label .n{order:3; margin-left:0;}
  .menu-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); gap:14px;}
  .menu-card{
    --c:#f2a91c; position:relative; overflow:hidden; isolation:isolate;
    display:flex; align-items:center; gap:14px; padding:16px 16px 16px 18px; border-radius:14px; min-height:92px;
    background:linear-gradient(150deg, color-mix(in srgb, var(--c) 13%, transparent), color-mix(in srgb, var(--c) 3%, transparent) 60%), rgba(255,255,255,.015);
    border:1px solid color-mix(in srgb, var(--c) 28%, transparent);
    text-decoration:none; color:inherit;
    transition:transform .18s ease, border-color .18s, box-shadow .18s, background .18s;
  }
  /* แสงมุมขวาบน (ตกแต่ง) */
  .menu-card::after{content:""; position:absolute; right:-40px; top:-40px; width:120px; height:120px; border-radius:50%; z-index:-1;
    background:radial-gradient(circle, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%); opacity:.6; transition:opacity .18s, transform .3s;}
  .menu-card:hover, .menu-card:focus-visible{
    transform:translateY(-3px); border-color:color-mix(in srgb, var(--c) 75%, transparent); outline:none;
    box-shadow:0 12px 28px -14px color-mix(in srgb, var(--c) 70%, transparent), 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent);
    background:linear-gradient(150deg, color-mix(in srgb, var(--c) 20%, transparent), color-mix(in srgb, var(--c) 5%, transparent) 60%), rgba(255,255,255,.02);
  }
  .menu-card:hover::after{opacity:1; transform:scale(1.25);}
  .menu-card:active{transform:translateY(-1px);}
  .menu-card .icon-shell{
    width:46px; height:46px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    /* ไอคอนแบบแอป: กล่องสีเต็มไล่เฉด (สว่างบนซ้าย → เข้มล่างขวา) + ไอคอนขาว + เงาสีของกลุ่ม */
    background:linear-gradient(145deg, color-mix(in srgb, var(--c) 100%, #fff 18%), color-mix(in srgb, var(--c) 100%, #000 38%));
    border:1px solid color-mix(in srgb, var(--c) 100%, #fff 25%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 6px 14px -6px color-mix(in srgb, var(--c) 80%, transparent);
    transition:transform .2s ease, box-shadow .2s;
  }
  .menu-card:hover .icon-shell{transform:scale(1.07) rotate(-4deg); box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 10px 20px -6px color-mix(in srgb, var(--c) 90%, transparent);}
  .menu-card svg{width:22px; height:22px; color:#fff; stroke-width:2.1; filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));}
  .menu-card .text{min-width:0; flex:1;}
  .menu-card .title{font-size:14.5px; font-weight:700; color:#fff; line-height:1.35;}
  /* เมนู On process (เห็นเฉพาะกลุ่มระบบ) */
  .wip-tag{display:inline-block; margin-left:8px; padding:0 6px; border-radius:4px; vertical-align:2px;
    font-family:'JetBrains Mono',monospace; font-size:9.5px; font-weight:700; letter-spacing:.05em;
    color:#c4b5fd; background:rgba(167,139,250,.14); border:1px dashed rgba(167,139,250,.5);}
  /* คำอธิบาย: 2 บรรทัด (การ์ดสูงเท่ากัน) — ข้อความเต็มอยู่ใน title ของการ์ด */
  .menu-card .desc{font-size:12.5px; color:#b8c3d1; margin-top:4px; line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .menu-card .arrow{width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:15px;
    color:var(--c); background:color-mix(in srgb, var(--c) 10%, transparent); border:1px solid color-mix(in srgb, var(--c) 30%, transparent);
    transition:transform .18s, background .18s, color .18s;}
  .menu-card:hover .arrow{transform:translateX(3px); background:var(--c); color:#0c1420;}
  @media (prefers-reduced-motion:reduce){ .menu-card, .menu-card .icon-shell, .menu-card .arrow, .menu-card::after{transition:none;} .menu-card:hover{transform:none;} .menu-card:hover .icon-shell{transform:none;} }

  .empty-state{
    text-align:center; padding:50px 20px; border-radius:var(--radius);
    border:1px dashed rgba(255,255,255,.12); color:var(--concrete-400);
  }
  .empty-state .big{font-size:36px; margin-bottom:10px;}
  .empty-state b{display:block; color:#fff; font-size:16px; margin-bottom:6px;}
  .error-note{font-size:12.8px; color:#ff8a75; padding:14px 16px; border-radius:var(--radius); border:1px solid rgba(229,83,61,.3); background:rgba(229,83,61,.06);}

  /* ช่องค้นหาเมนู Ctrl+K */
  .palette-backdrop{
    position:fixed; inset:0; z-index:50; background:rgba(5,10,18,.7); backdrop-filter:blur(3px);
    display:none; align-items:flex-start; justify-content:center; padding:12vh 16px 16px;
  }
  .palette-backdrop.open{display:flex;}
  .palette{

  footer{

    body.sidebar-open .sidebar{transform:translateX(0);}

  @media (max-width:600px){

    .menu-card{min-height:0; padding:14px 14px 14px 16px;}
    .group-label{font-size:13.5px; flex-wrap:wrap; row-gap:4px;}
    .group-label::after{display:none;}
    .group-label .n{margin-left:auto;}
    .search-btn{min-width:0; width:100%;}
    .search-btn kbd{display:none;}
    .palette-foot{display:none;}
    /* ผลค้นหาเมนู: ชื่อเมนูเต็มบรรทัด / กลุ่มเมนูอยู่บรรทัดใต้ (เดิมกลุ่มยาวดันชื่อเมนูจนอ่านไม่ออก) */

    .palette-item > span:not(.grp){flex:1 1 0; min-width:0; overflow-wrap:anywhere;}
    .palette-item .grp{margin-left:30px; flex:1 1 100%; white-space:normal;}
  }
</style>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>
  const SUMMARY_REFRESH_MS = 60 * 1000;
  const RECENT_KEY = 'wim_recent_menus';
  const RECENT_MAX = 4;

  let wipCodes = new Set();  // เมนู On process (WIMWebMenu.stWip)
  let myMenus = [];          // เมนูที่ผู้ใช้มีสิทธิ์ (จาก WIM_MENUS)
  let allowedCodes = null;   // null = ใช้ได้ทุกเมนู

  const svg = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${WIM_ICONS[name] || ''}</svg>`;
  const nf = (n) => Number(n || 0).toLocaleString('th-TH');

  // Sidebar: ใช้ไฟล์กลาง sidebar.js (เมนู / ไฮไลต์ / เปิด-ปิดกลุ่ม / มือถือ) — ผู้ใช้ + สิทธิ์ หน้านี้จัดการเอง (initAuthUser / lockSidebar)
  async function loadSidebar() {
    await WIMSidebar.load({ manageUser: false });
    initAuthUser();
  }

  // ดึงข้อมูลผู้ใช้ปัจจุบันจาก Session ของ Backend ทันทีที่โหลดหน้าหลัก
  async function initAuthUser() {
    try {
      const res = await fetch('/api/auth/me');
      const data = await res.json();

      if (!data.success) {
        window.location.href = '/';
        return;
      }

      const user = data.user;
      // เก็บลง sessionStorage เผื่อหน้าอื่นใช้ต่อ
      sessionStorage.setItem('wim_user', JSON.stringify(user));

      // เข้ามาจากลิงก์ที่ต้อง login ก่อน (เช่น ลิงก์ตอบกลับคำร้อง) แต่ login แล้วตกมาหน้านี้ -> พากลับไปลิงก์เดิม
      try {
        const back = JSON.parse(localStorage.getItem('wim_return_to') || 'null');
        localStorage.removeItem('wim_return_to');
        if (back && back.exp > Date.now() && /^\/(?![\/\\])/.test(back.path)) {
          window.location.replace(back.path);
          return;
        }
      } catch (e) { /* storage ใช้ไม่ได้ ก็อยู่หน้าเมนูตามปกติ */ }

      const fullName = [user.PsName].filter(Boolean).join(' ').trim();
      const displayName = fullName || user.Username || user.username || user.UN || 'ผู้ใช้งาน';

      const userLabelEl = document.getElementById('userLabel');
      if (userLabelEl) userLabelEl.textContent = displayName;

      await loadHome();
      setInterval(() => { if (!document.hidden) loadSummary(); }, SUMMARY_REFRESH_MS);
    } catch (err) {
      console.error('Auth check error:', err);
      window.location.href = '/';
    }
  }

  // ==================================================================
  // ---------- หน้า Home ----------
  // ==================================================================
  function renderHeader() {
    document.getElementById('todayLabel').textContent =
      new Date().toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }

  async function loadHome() {
    renderHeader();
    const ok = await loadSummary();
    if (!ok) {
      // โหลดตัวเลขสรุปไม่ได้ ก็ยังแสดงเมนูตามสิทธิ์ได้
      try {
        const res = await fetch('/api/permissions/my');
        const data = await res.json();
        if (data.success) {
          setAllowed(data.unrestricted ? null : data.allowedMenuCodes, data.menuOrder, data.wipMenuCodes);
          applyWip(data);
        }
      } catch (e) { console.error('โหลดสิทธิ์ไม่สำเร็จ:', e); }
    }
    renderMenus();
    renderRecent();
  }

  // order = { MenuCode: SortOrder } จาก WIMWebMenu — เรียงเมนูภายในแต่ละกลุ่มตาม DB (ลำดับกลุ่มคงตาม menu-config.js)
  // เมนูที่ไม่มีใน DB ต่อท้ายกลุ่มตามลำดับเดิม
  // wip = เมนู On process (ผู้ใช้ทั่วไปไม่มีใน codes อยู่แล้ว / กลุ่มระบบเห็นการ์ดพร้อมป้าย WIP)
  function setAllowed(codes, order, wip) {
    allowedCodes = codes ? new Set(codes) : null;
    wipCodes = new Set(wip || []);
    const groupIdx = new Map();
    WIM_MENUS.forEach(m => { if (!groupIdx.has(m.group)) groupIdx.set(m.group, groupIdx.size); });
    const key = (m) => (order && order[m.code] != null ? order[m.code] : Number.MAX_SAFE_INTEGER);
    myMenus = WIM_MENUS
      .map((m, i) => ({ m, i }))
      .filter(({ m }) => !allowedCodes || allowedCodes.has(m.code))
      .sort((a, b) => groupIdx.get(a.m.group) - groupIdx.get(b.m.group) || key(a.m) - key(b.m) || a.i - b.i)
      .map(({ m }) => m);
    lockSidebar();
  }

  // ซ่อนเมนู On process ใน sidebar — แยก try ไว้ ถ้า sidebar.js เป็นตัวเก่า (browser cache) ตัวเลขสรุปยังแสดงได้
  function applyWip(data) {
    try {
      if (window.WIMSidebar && WIMSidebar.applyWipMenus) WIMSidebar.applyWipMenus(document, data.wipMenuCodes, data.unrestricted);
    } catch (e) { console.error('ซ่อนเมนู On process ไม่สำเร็จ:', e); }
  }

  // ล็อกเมนูใน sidebar ที่ไม่มีสิทธิ์ (เหมือนหน้าอื่น)
  function lockSidebar() {
    if (!allowedCodes) return;
    document.querySelectorAll('#sidebar [data-menu]').forEach(el => {
      if ((el.getAttribute('data-menu') || '').split(',').some(c => allowedCodes.has(c.trim())) || el.classList.contains('menu-locked')) return;
      el.classList.add('menu-locked');
      el.setAttribute('title', 'ไม่มีสิทธิ์เข้าถึงเมนูนี้ ติดต่อผู้ดูแลระบบ');
      el.addEventListener('click', (e) => e.preventDefault());
    });
  }

  // ตัวเลขสรุป: server ส่งมาเฉพาะส่วนที่ผู้ใช้มีสิทธิ์
  async function loadSummary() {
    const grid = document.getElementById('kpiGrid');
    try {
      const res = await fetch('/api/home/summary');
      if (res.status === 401) { window.location.href = '/'; return false; }
      const data = await res.json();
      if (!data.success) throw new Error(data.message);

      setAllowed(data.unrestricted ? null : data.allowedMenuCodes, data.menuOrder, data.wipMenuCodes);
      applyWip(data);

      const cards = buildKpiCards(data.data || {}, data.companies);
      document.getElementById('kpiSection').hidden = cards.length === 0;
      grid.innerHTML = cards.join('');
      document.getElementById('updatedAt').textContent =
        'อัปเดต ' + new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.';
      return true;
    } catch (err) {
      console.error('โหลดข้อมูลสรุปไม่สำเร็จ:', err);
      grid.style.display = 'block';
      grid.innerHTML = '<div class="error-note">โหลดข้อมูลสรุปไม่สำเร็จ — ลองรีเฟรชหน้าอีกครั้ง</div>';
      return false;
    }
  }

  function kpiCard({ href, icon, label, value, unit, subs, cta, live, comps, compTag, group }) {
    return `
      <div class="kpi-card" style="--c:${groupColor(group || 'งานรออนุมัติ')}">
        <div class="kpi-top">
          <div class="kpi-icon">${svg(icon)}</div>
          <div class="kpi-label">${label}</div>
          ${live ? '<span class="live-dot" title="มีงานกำลังดำเนินการ"></span>' : ''}
        </div>
        ${compTag ? `<span class="comp-tag" title="${esc(compTag)}">${esc(shortComp(compTag))}</span>` : ''}
        <div class="kpi-value ${value ? '' : 'zero'}">${nf(value)}<small>${unit}</small></div>
        <div class="kpi-sub">${subs.join('')}</div>
        ${comps || ''}
        <a class="kpi-cta" href="${href}" data-go="${href}"><span>${cta}</span><span class="arrow">→</span></a>
      </div>`;
  }

  // ชื่อบริษัทแบบสั้น (ตัด "บริษัท" / "จำกัด") ให้พอดีการ์ด — ชื่อเต็มอยู่ใน title
  const shortComp = (name) => String(name || '').replace(/^บริษัท\s*/, '').replace(/\s*จำกัด.*$/, '').trim() || '-';
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

  // ยอดแยกรายบริษัท — แต่ละแถวลิงก์ไปหน้านั้นพร้อมเลือกบริษัทไว้ (?comp=)
  // numText(c) = ข้อความตัวเลขของบริษัทนั้น (ต่างกันระหว่างเคลือบ / ลดความชื้น)
  function compList(href, byComp, numText) {
    if (!Array.isArray(byComp)) return '';   // server.js รุ่นเก่ายังไม่ส่งยอดแยกบริษัท -> ไม่แสดงส่วนนี้ (ไม่ขึ้นว่าไม่มีงานค้างผิดๆ)
    if (byComp.length === 0) return '<div class="comp-list"><div class="comp-none">ไม่มีงานค้างในบริษัทที่คุณมีสิทธิ์</div></div>';
    return `
      <div class="comp-list">
        <div class="comp-list-label">แยกตามบริษัท</div>
        ${byComp.map(c => `
          <a class="comp-row" href="${href}?comp=${encodeURIComponent(c.id)}" data-go="${href}" title="${esc(c.name)}">
            <span class="ctext">
              <span class="cname">${esc(shortComp(c.name))}</span>
              <span class="cnum">${numText(c)}</span>
            </span>
            <span class="arrow">→</span>
          </a>`).join('')}
      </div>`;
  }

  function buildKpiCards(d, companies) {
    const cards = [];
    // companies = บริษัทที่มีสิทธิ์ (null = ทุกบริษัท) / มีสิทธิ์บริษัทเดียว -> ไม่ต้องแยก แค่บอกชื่อบริษัท
    const single = Array.isArray(companies) && companies.length === 1 ? companies[0] : null;

    // แยกรายบริษัทเฉพาะเมื่องานค้างมาจาก 2 บริษัทขึ้นไป / มาจากบริษัทเดียว -> ป้ายชื่อบริษัท + ลิงก์เปิดบริษัทนั้น
    function compView(href, byComp, numText) {
      const rows = Array.isArray(byComp) ? byComp : null;
      const only = single || (rows && rows.length === 1 ? rows[0] : null);
      if (only) return { href: `${href}?comp=${encodeURIComponent(only.id)}`, compTag: only.name, allLabel: '', comps: '' };
      if (!rows || rows.length === 0) return { href, compTag: null, allLabel: '', comps: '' };
      return { href, compTag: null, allLabel: ' <span>(รวมทุกบริษัท)</span>', comps: compList(href, rows, numText) };
    }

    if (d.coating) {
      const v = compView('/coating', d.coating.byComp,
        c => `กำลังเคลือบ <b>${nf(c.inprogress)}</b> · รอคิว <b>${nf(c.waiting)}</b>`);
      cards.push(kpiCard({
        href: v.href, icon: 'seed', label: 'เคลือบเมล็ด', compTag: v.compTag, group: 'การจัดการเมล็ดพันธุ์',
        value: d.coating.inprogress, unit: 'รายการกำลังเคลือบ', live: d.coating.inprogress > 0,
        subs: [`<span>รอคิว <b>${nf(d.coating.waiting)}</b> รายการ${v.allLabel}</span>`],
        comps: v.comps,
        cta: 'ไปลงเวลาเคลือบเมล็ด'
      }));
    }
    if (d.moisture) {
      const v = compView('/moisture', d.moisture.byComp,
        c => `กำลังทำ <b>${nf(c.inprogress)}</b> · รอคิว <b>${nf(c.waiting)}</b>`);
      cards.push(kpiCard({
        href: v.href, icon: 'drop', label: 'ลดความชื้น', compTag: v.compTag, group: 'การจัดการเมล็ดพันธุ์',
        value: d.moisture.inprogress, unit: 'รายการกำลังลดความชื้น', live: d.moisture.inprogress > 0,
        subs: [`<span>รอคิว <b>${nf(d.moisture.waiting)}</b> รายการ${v.allLabel}</span>`],
        comps: v.comps,
        cta: 'ไปลงเวลาลดความชื้น'
      }));
    }
    if (d.urs) {
      cards.unshift(kpiCard({
        href: '/urs-request', icon: 'bolt', label: 'ร้องขอเมล็ดพันธุ์เร่งด่วน', group: 'คำร้องขอ',
        value: d.urs.awaitingReply, unit: 'รายการรอตอบกลับ', live: false,
        subs: [
          `<span class="${d.urs.notReady ? 'warn' : ''}">ไม่พร้อมส่ง <b>${nf(d.urs.notReady)}</b></span>`,
          `<span>Draft <b>${nf(d.urs.draftDocs)}</b> ฉบับ</span>`
        ],
        cta: 'ไปที่รายการคำร้อง'
      }));
    }
    // ตรวจนับสต๊อก: ก่อนร้องขอเมล็ด (unshift ทีหลัง = อยู่หน้าสุดในกลุ่มนี้) — รอตรวจสอบผลต่าง = งานของผู้มีสิทธิ์ตรวจสอบ (สีส้ม)
    if (d.stockCount) {
      const s = d.stockCount;
      const v = compView('/stock-count', s.byComp,
        c => `กำลังนับ <b>${nf(c.counting)}</b> · รอตรวจสอบ <b>${nf(c.review)}</b>`);
      cards.unshift(kpiCard({
        href: v.href, icon: 'box', label: 'ตรวจนับสต๊อก', compTag: v.compTag, group: 'คลังวัสดุและสินค้า',
        value: s.counting, unit: 'เอกสารกำลังนับ', live: s.counting > 0,
        subs: [
          `<span class="${s.review && s.canReview ? 'warn' : ''}">รอตรวจสอบผลต่าง <b>${nf(s.review)}</b> ฉบับ${v.allLabel}</span>`,
          `<span>ร่าง <b>${nf(s.draft)}</b> ฉบับ</span>`
        ],
        comps: v.comps,
        cta: 'ไปที่เอกสารตรวจนับ'
      }));
    }
    // งานรออนุมัติของฉัน (ทุกเรื่อง) — การ์ดแรก / server รุ่นเก่าไม่มี approvals → ใช้การ์ด Over PO เดิม
    if (d.approvals) {
      const c = d.approvals.counts || {};
      const part = [['rq', 'ใบขอปรับยอดสต๊อก'], ['rts', 'ส่งคืนสินค้า Supplier'], ['ops', 'ขอรับซื้อเมล็ด Over PO']].filter(([k]) => c[k]);
      cards.unshift(kpiCard({
        href: '/approvals', icon: 'shield', label: 'งานรออนุมัติของฉัน',
        value: d.approvals.total, unit: 'รายการรอคุณดำเนินการ', live: true,
        subs: part.map(([k, n]) => `<span>${n} <b>${nf(c[k])}</b></span>`),
        cta: 'ไปที่งานรออนุมัติ'
      }));
    } else if (d.opsApv) {
      cards.unshift(kpiCard({   // การ์ดแรก: เกี่ยวกับผู้บริหาร / ผู้อนุมัติมากที่สุด
        href: '/over-po-sale-apv', icon: 'shield', label: 'รอการพิจารณาอนุมัติขอซื้อ (Over PO)',
        value: d.opsApv.pending, unit: 'รายการรอท่านพิจารณา', live: true,
        subs: [`<span>มูลค่ารวม <b>${Number(d.opsApv.total || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</b> บาท</span>`],
        cta: 'ไปพิจารณารายการ'
      }));
    }
    return cards;
  }

  // สีประจำกลุ่มเมนูหลัก (คำแรกของ group ก่อน " · ") — กลุ่มใหม่ที่ไม่มีในนี้ใช้สีอำพัน
  const GROUP_COLOR = {
    'งานรออนุมัติ': '#f2a91c', 'คลังวัสดุและสินค้า': '#4ea7e0', 'การจัดการเมล็ดพันธุ์': '#3ecf8e', 'คำร้องขอ': '#a78bfa',
    'รายงาน': '#2dd4bf', 'ระบบ': '#94a3b8', 'คู่มือการใช้งาน': '#f472b6'
  };
  const groupColor = (g) => GROUP_COLOR[String(g || '').split(' · ')[0]] || '#f2a91c';
  function menuCard(m) {
    return `
      <a class="menu-card" href="${m.href}" data-go="${m.href}" style="--c:${groupColor(m.group)}" title="${String(m.desc || '').replace(/"/g, '&quot;')}">
        <div class="icon-shell">${svg(m.icon)}</div>
        <div class="text">
          <div class="title">${m.title}${wipCodes.has(m.code) ? '<span class="wip-tag">WIP</span>' : ''}</div>
          <div class="desc">${m.desc}</div>
        </div>
        <span class="arrow">→</span>
      </a>`;
  }

  function renderMenus() {
    const area = document.getElementById('menuArea');
    if (!myMenus.length) {
      area.innerHTML = `
        <div class="empty-state">
          <div class="big">🔒</div>
          <b>บัญชีของคุณยังไม่ได้รับสิทธิ์ใช้งานเมนู</b>
          กรุณาแจ้งผู้ดูแลระบบเพื่อเปิดสิทธิ์การใช้งาน<br>
          <small>หากได้รับลิงก์ตอบกลับคำร้องขอเมล็ดพันธุ์ ยังเปิดลิงก์เพื่อตอบกลับได้ตามปกติ</small>
        </div>`;
      return;
    }
    const groups = [];
    myMenus.forEach(m => {
      let g = groups.find(x => x.name === m.group);
      if (!g) groups.push(g = { name: m.group, items: [] });
      g.items.push(m);
    });
    // หัวกลุ่ม: กลุ่มหลัก (ตัวหนา) › กลุ่มย่อย + จำนวนเมนู
    area.innerHTML = groups.map(g => { const [main, ...sub] = g.name.split(' · '); return `
      <div class="group-label" style="--c:${groupColor(g.name)}"><span>${main}</span>${sub.length ? `<span class="sub">${sub.join(' · ')}</span>` : ''}<span class="n">${g.items.length} เมนู</span></div>
      <div class="menu-grid">${g.items.map(menuCard).join('')}</div>`; }).join('');
  }

  // ---------- ใช้ล่าสุด (เก็บในเครื่องนี้เท่านั้น) ----------
  function readRecent() {
    try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch (e) { return []; }
  }
  function pushRecent(href) {
    try {
      const list = [href, ...readRecent().filter(h => h !== href)].slice(0, RECENT_MAX);
      localStorage.setItem(RECENT_KEY, JSON.stringify(list));
    } catch (e) { /* storage ใช้ไม่ได้ ไม่เป็นไร */ }
  }
  function renderRecent() {
    const items = readRecent().map(h => myMenus.find(m => m.href === h)).filter(Boolean);
    document.getElementById('recentSection').hidden = items.length === 0;
    document.getElementById('recentRow').innerHTML = items.map(m =>
      `<a class="recent-chip" href="${m.href}" data-go="${m.href}" style="--c:${groupColor(m.group)}">${svg(m.icon)}${m.title}</a>`).join('');
  }
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-go]');
    if (a) pushRecent(a.getAttribute('data-go'));
  });

  // ==================================================================
  // ---------- ช่องค้นหาเมนู (Ctrl+K) ----------
  // ==================================================================
  const palette = document.getElementById('palette');
  const paletteInput = document.getElementById('paletteInput');
  const paletteList = document.getElementById('paletteList');
  let paletteItems = [];
  let paletteIndex = 0;

  function openPalette() {
    palette.classList.add('open');
    paletteInput.value = '';
    renderPalette();
    setTimeout(() => paletteInput.focus(), 0);
  }
  function closePalette() { palette.classList.remove('open'); }

  function renderPalette() {
    const q = paletteInput.value.trim().toLowerCase();
    paletteItems = myMenus.filter(m =>
      !q || (m.title + ' ' + m.group + ' ' + m.desc + ' ' + m.keywords).toLowerCase().includes(q));
    paletteIndex = 0;
    if (!paletteItems.length) {
      paletteList.innerHTML = '<div class="palette-empty">ไม่พบเมนูที่ตรงกับคำค้น</div>';
      return;
    }
    paletteList.innerHTML = paletteItems.map((m, i) =>
      `<a class="palette-item ${i === 0 ? 'active' : ''}" href="${m.href}" data-go="${m.href}" data-i="${i}">
         ${svg(m.icon)}<span>${m.title}</span><span class="grp">${m.group}</span>
       </a>`).join('');
  }

  function movePalette(step) {
    if (!paletteItems.length) return;
    paletteIndex = (paletteIndex + step + paletteItems.length) % paletteItems.length;
    paletteList.querySelectorAll('.palette-item').forEach((el, i) => {
      el.classList.toggle('active', i === paletteIndex);
      if (i === paletteIndex) el.scrollIntoView({ block: 'nearest' });
    });
  }

  document.getElementById('openPalette').addEventListener('click', openPalette);
  palette.addEventListener('click', (e) => { if (e.target === palette) closePalette(); });
  paletteInput.addEventListener('input', renderPalette);
  paletteList.addEventListener('mousemove', (e) => {
    const item = e.target.closest('.palette-item');
    if (item && Number(item.dataset.i) !== paletteIndex) movePalette(Number(item.dataset.i) - paletteIndex);
  });
  paletteInput.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); movePalette(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); movePalette(-1); }
    else if (e.key === 'Enter' && paletteItems[paletteIndex]) {
      const m = paletteItems[paletteIndex];
      pushRecent(m.href);
      window.location.href = m.href;
    }
  });
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      palette.classList.contains('open') ? closePalette() : openPalette();
    } else if (e.key === 'Escape' && palette.classList.contains('open')) {
      closePalette();
    }
  });

  // เริ่มต้นเรียกทำงาน
  loadSidebar();
</script>

</body>
</html>
